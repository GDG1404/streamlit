<title>Python op papier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: één kolom "schriftblad" (max 780px) op ruitjespapier, met een sticky bovenbalk.
   Bic-blauw voor acties, fluogeel voor "deze regel nu", rode correctiepen voor fouten. */
:root {
  --papier: #f8fafd;
  --ruit: rgba(64, 104, 190, 0.09);
  --kantlijn: rgba(214, 64, 52, 0.28);
  --kaart: #ffffff;
  --inkt: #18213a;
  --inkt-zacht: #56607a;
  --inkt-flauw: #8a93a8;
  --lijn: #d8deea;
  --bic: #1f45c2;
  --bic-zacht: #e7edfc;
  --bic-tekst: #ffffff;
  --fluo: #fff27a;
  --fluo-rand: #e8d634;
  --rood: #c9372c;
  --rood-zacht: #fdeceb;
  --groen: #1c7f47;
  --groen-zacht: #e5f4ea;
  --oranje: #b45e09;
  --oranje-zacht: #fbf0e2;
  --code-bg: #f1f4fa;
  --kw: #7a2fb5;
  --str: #1c7f47;
  --num: #b45e09;
  --com: #8a93a8;
  --bi: #1f45c2;
  --schaduw: 0 1px 2px rgba(24, 33, 58, 0.06), 0 4px 14px rgba(24, 33, 58, 0.06);

  --f-tekst: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-code: "Atkinson Hyperlegible Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;

  --t-xs: 0.8125rem;
  --t-s: 0.9375rem;
  --t-m: 1.0625rem;
  --t-l: 1.3125rem;
  --t-xl: 1.75rem;
  --t-xxl: 2.375rem;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #10141d;
    --ruit: rgba(140, 170, 255, 0.06);
    --kantlijn: rgba(255, 120, 110, 0.22);
    --kaart: #171c28;
    --inkt: #e6eaf4;
    --inkt-zacht: #a3acc2;
    --inkt-flauw: #737c93;
    --lijn: #2a3245;
    --bic: #8aa5ff;
    --bic-zacht: #1d2742;
    --bic-tekst: #0d1120;
    --fluo: rgba(255, 228, 64, 0.22);
    --fluo-rand: rgba(255, 228, 64, 0.55);
    --rood: #ff8277;
    --rood-zacht: #3a1d1d;
    --groen: #63d395;
    --groen-zacht: #173022;
    --oranje: #f2a65a;
    --oranje-zacht: #33261a;
    --code-bg: #0c1018;
    --kw: #d3a2ff;
    --str: #7ee0a5;
    --num: #f5b66e;
    --com: #6f7890;
    --bi: #9db4ff;
    --schaduw: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #10141d;
  --ruit: rgba(140, 170, 255, 0.06);
  --kantlijn: rgba(255, 120, 110, 0.22);
  --kaart: #171c28;
  --inkt: #e6eaf4;
  --inkt-zacht: #a3acc2;
  --inkt-flauw: #737c93;
  --lijn: #2a3245;
  --bic: #8aa5ff;
  --bic-zacht: #1d2742;
  --bic-tekst: #0d1120;
  --fluo: rgba(255, 228, 64, 0.22);
  --fluo-rand: rgba(255, 228, 64, 0.55);
  --rood: #ff8277;
  --rood-zacht: #3a1d1d;
  --groen: #63d395;
  --groen-zacht: #173022;
  --oranje: #f2a65a;
  --oranje-zacht: #33261a;
  --code-bg: #0c1018;
  --kw: #d3a2ff;
  --str: #7ee0a5;
  --num: #f5b66e;
  --com: #6f7890;
  --bi: #9db4ff;
  --schaduw: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 14px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--papier);
  background-image:
    linear-gradient(var(--ruit) 1px, transparent 1px),
    linear-gradient(90deg, var(--ruit) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--inkt);
  font-family: var(--f-tekst);
  font-size: var(--t-m);
  line-height: 1.55;
  min-height: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--kaart);
}

a { color: var(--bic); }
h1, h2, h3 { line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: var(--t-xxl); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: var(--t-xl); font-weight: 800; letter-spacing: -0.01em; }
h3 { font-size: var(--t-l); font-weight: 700; }
p { margin: 0; }
code, kbd, .mono { font-family: var(--f-code); }
:focus-visible { outline: 3px solid var(--bic); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------------- Bovenbalk ---------------- */
.balk {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--kaart);
  border-bottom: 1px solid var(--lijn);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.balk-binnen {
  max-width: 980px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 8px 20px;
  flex-wrap: wrap;
  padding-block: 8px;
}
.merk {
  display: flex;
  align-items: baseline;
  gap: 6px;
  text-decoration: none;
  color: var(--inkt);
}
.merk-py { font-family: var(--f-code); font-weight: 600; font-size: 1.05rem; color: var(--bic); }
.merk-op { font-family: var(--f-hand); font-size: 1.45rem; font-weight: 700; line-height: 1; }
.tabs {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  margin-left: auto;
  min-width: 0;
  max-width: 100%;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs a {
  padding: 7px 11px;
  border-radius: 8px;
  color: var(--inkt-zacht);
  text-decoration: none;
  font-weight: 600;
  font-size: var(--t-s);
  white-space: nowrap;
}
.tabs a:hover { color: var(--inkt); background: var(--bic-zacht); }
.tabs a[aria-current="page"] { color: var(--bic); background: var(--bic-zacht); }
@media (max-width: 640px) {
  .tabs { margin-left: 0; width: 100%; }
  .tabs a { padding: 7px 8px; font-size: var(--t-xs); }
}

/* ---------------- Blad ---------------- */
.blad {
  max-width: 780px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 80px;
  display: flex;
  flex-direction: column;
  gap: 28px;
  position: relative;
  outline: none;
}
@media (min-width: 900px) {
  .blad::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -28px;
    width: 2px;
    background: var(--kantlijn);
  }
}
.sectie { display: flex; flex-direction: column; gap: 14px; }
.kop { display: flex; flex-direction: column; gap: 6px; }
.oogje {
  font-size: var(--t-xs);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--inkt-zacht);
}
.inleiding { color: var(--inkt-zacht); max-width: 62ch; }
.hand { font-family: var(--f-hand); font-weight: 700; }
.groet { font-family: var(--f-hand); font-size: 3rem; line-height: 1; font-weight: 700; }
.groet .onderlijn {
  background: linear-gradient(transparent 62%, var(--fluo) 62%, var(--fluo) 92%, transparent 92%);
  padding: 0 4px;
}
.tekst { display: flex; flex-direction: column; gap: 10px; max-width: 66ch; }
.tekst ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.tekst code, .inline-code {
  font-family: var(--f-code);
  font-size: 0.92em;
  background: var(--code-bg);
  border: 1px solid var(--lijn);
  border-radius: 5px;
  padding: 0 4px;
  white-space: nowrap;
}
.tekst strong { font-weight: 800; }

/* ---------------- Kaarten & knoppen ---------------- */
.kaart {
  background: var(--kaart);
  border: 1px solid var(--lijn);
  border-radius: var(--r);
  padding: 18px;
  box-shadow: var(--schaduw);
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}
.kaart.vlak { box-shadow: none; }
.rij { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.rij.eind { justify-content: flex-end; }
.rij.tussen { justify-content: space-between; }
.knop {
  appearance: none;
  border: 1.5px solid var(--bic);
  background: var(--bic);
  color: var(--bic-tekst);
  font: inherit;
  font-weight: 700;
  font-size: var(--t-s);
  border-radius: 9px;
  padding: 10px 16px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  line-height: 1.2;
  min-height: 44px;
}
.knop:hover { filter: brightness(1.08); }
.knop:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
.knop.tweede { background: transparent; color: var(--bic); }
.knop.tweede:hover { background: var(--bic-zacht); }
.knop.stil { background: transparent; border-color: transparent; color: var(--inkt-zacht); }
.knop.stil:hover { color: var(--inkt); background: var(--bic-zacht); }
.knop.klein { min-height: 36px; padding: 6px 12px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--t-xs);
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 99px;
  background: var(--bic-zacht);
  color: var(--bic);
  white-space: nowrap;
}
.chip.goed { background: var(--groen-zacht); color: var(--groen); }
.chip.fout { background: var(--rood-zacht); color: var(--rood); }
.chip.half { background: var(--oranje-zacht); color: var(--oranje); }
.chip.grijs { background: var(--code-bg); color: var(--inkt-zacht); }
.chip.uitdaging { background: var(--oranje-zacht); color: var(--oranje); }

.balkje { height: 8px; border-radius: 99px; background: var(--code-bg); border: 1px solid var(--lijn); overflow: hidden; }
.balkje > span { display: block; height: 100%; background: var(--bic); border-radius: 99px; }
.balkje.groen > span { background: var(--groen); }

.cijfers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.cijfer { display: flex; flex-direction: column; gap: 2px; }
.cijfer b { font-size: var(--t-xl); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.cijfer span { font-size: var(--t-xs); color: var(--inkt-zacht); }
@media (max-width: 480px) { .cijfers { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } .cijfer b { font-size: var(--t-l); } }

/* ---------------- Code ---------------- */
.code {
  background: var(--code-bg);
  border: 1px solid var(--lijn);
  border-radius: 8px;
  font-family: var(--f-code);
  font-size: 0.95rem;
  line-height: 1.6;
  overflow-x: auto;
  padding-block: 8px;
  min-width: 0;
}
.code .r { display: grid; grid-template-columns: 2.6em 1fr; min-width: max-content; }
.code .ln {
  color: var(--inkt-flauw);
  text-align: right;
  padding-right: 12px;
  user-select: none;
  font-variant-numeric: tabular-nums;
}
.code .s { white-space: pre; padding-right: 16px; }
.code .r.nu { background: var(--fluo); box-shadow: inset 3px 0 0 var(--fluo-rand); }
.code .r.vorige .s { text-decoration: underline; text-decoration-color: var(--inkt-flauw); text-decoration-style: dotted; text-underline-offset: 4px; }
.code .r.fout-regel { background: var(--rood-zacht); box-shadow: inset 3px 0 0 var(--rood); }
.code .r.goed-regel { background: var(--groen-zacht); box-shadow: inset 3px 0 0 var(--groen); }
.code.klikbaar .r { cursor: pointer; }
.code.klikbaar .r:hover { background: var(--bic-zacht); }
.code.klikbaar .r.gekozen { background: var(--bic-zacht); box-shadow: inset 3px 0 0 var(--bic); }
.code .vakje {
  font: inherit;
  width: 7ch;
  min-width: 4ch;
  padding: 0 4px;
  border: 1.5px dashed var(--bic);
  border-radius: 5px;
  background: var(--kaart);
  color: var(--inkt);
  height: 1.5em;
}
.code .vakje.ok { border-style: solid; border-color: var(--groen); background: var(--groen-zacht); }
.code .vakje.nok { border-style: solid; border-color: var(--rood); background: var(--rood-zacht); }
.tk-kw { color: var(--kw); font-weight: 600; }
.tk-str { color: var(--str); }
.tk-num { color: var(--num); }
.tk-com { color: var(--com); font-style: italic; }
.tk-bi { color: var(--bi); }

.uitvoer {
  font-family: var(--f-code);
  font-size: 0.95rem;
  white-space: pre;
  overflow-x: auto;
  padding: 10px 14px;
  border: 1.5px dashed var(--lijn);
  border-radius: 8px;
  background: var(--kaart);
  min-height: 2.6em;
  line-height: 1.55;
}
.uitvoer.leeg { color: var(--inkt-flauw); font-family: var(--f-tekst); font-style: italic; white-space: normal; }
.label { font-size: var(--t-xs); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--inkt-zacht); }
.blok { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

/* ---------------- Notities in de kantlijn ---------------- */
.notitie {
  font-family: var(--f-hand);
  font-size: 1.35rem;
  line-height: 1.25;
  color: var(--bic);
  font-weight: 600;
}
.notitie.rood { color: var(--rood); }
.notitie.groen { color: var(--groen); }
.papiertip {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 10px 12px;
  border-left: 3px solid var(--fluo-rand);
  background: var(--kaart);
  border-radius: 0 8px 8px 0;
  font-size: var(--t-s);
  color: var(--inkt-zacht);
}
.papiertip b { color: var(--inkt); }

/* ---------------- Leerpad ---------------- */
.pad { display: flex; flex-direction: column; gap: 12px; }
.niveau-kaart {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr);
  gap: 14px;
  align-items: start;
  text-decoration: none;
  color: inherit;
  background: var(--kaart);
  border: 1px solid var(--lijn);
  border-radius: var(--r);
  padding: 16px;
}
a.niveau-kaart:hover { border-color: var(--bic); }
.niveau-kaart.later { background: transparent; border-style: dashed; }
.niveau-kaart.aanbevolen { border: 2px solid var(--bic); }
.nr {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-family: var(--f-hand);
  font-size: 1.9rem;
  font-weight: 700;
  border: 2px solid var(--bic);
  color: var(--bic);
  background: var(--kaart);
}
.niveau-kaart.klaar .nr { background: var(--groen); border-color: var(--groen); color: var(--kaart); }
.niveau-kaart.later .nr { border-style: dashed; border-color: var(--inkt-flauw); color: var(--inkt-flauw); }
.niveau-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.niveau-info h3 { font-size: var(--t-l); }
.niveau-info .sub { color: var(--inkt-zacht); font-size: var(--t-s); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------------- Niveau-pagina ---------------- */
.les { display: flex; flex-direction: column; gap: 12px; padding-bottom: 22px; border-bottom: 1px solid var(--lijn); }
.les:last-child { border-bottom: 0; }
.les h3 { display: flex; gap: 10px; align-items: baseline; }
.les h3 .hand { color: var(--bic); font-size: 1.6rem; min-width: 1.2em; }
.code-en-uitvoer { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; align-items: start; }
@media (max-width: 640px) { .code-en-uitvoer { grid-template-columns: minmax(0, 1fr); } }
.oef-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.oef-tegel {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 10px 12px;
  border: 1px solid var(--lijn);
  border-radius: 8px;
  background: var(--kaart);
  color: inherit;
  text-decoration: none;
  font-size: var(--t-s);
}
.oef-tegel:hover { border-color: var(--bic); }
.oef-tegel .t { font-weight: 700; }
.oef-tegel .st { font-size: var(--t-xs); color: var(--inkt-zacht); display: flex; align-items: center; gap: 6px; }
.stip { width: 9px; height: 9px; border-radius: 50%; background: var(--lijn); display: inline-block; flex: none; }
.stip.goed { background: var(--groen); }
.stip.hulp { background: var(--oranje); }
.stip.fout { background: var(--rood); }

/* ---------------- Oefening ---------------- */
.oef-kop { display: flex; flex-direction: column; gap: 10px; }
.oef-lijf, .oef-resultaat, .oef-stapper { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.oef-resultaat:empty, .oef-stapper:empty, .oef-volgende:empty, .oef-acties:empty { display: none; }
.stippen { display: flex; gap: 5px; flex-wrap: wrap; }
.stippen a { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--lijn); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--inkt-zacht); text-decoration: none; background: var(--kaart); font-variant-numeric: tabular-nums; }
.stippen a.goed { background: var(--groen); border-color: var(--groen); color: var(--kaart); }
.stippen a.hulp { background: var(--oranje); border-color: var(--oranje); color: var(--kaart); }
.stippen a.fout { background: var(--rood-zacht); border-color: var(--rood); color: var(--rood); }
.stippen a.hier { border-color: var(--bic); border-width: 2.5px; color: var(--bic); }
.soort { font-family: var(--f-hand); font-size: 1.9rem; line-height: 1; color: var(--bic); font-weight: 700; }
.opties { display: flex; flex-direction: column; gap: 8px; }
.optie {
  appearance: none;
  text-align: left;
  font: inherit;
  color: var(--inkt);
  background: var(--kaart);
  border: 1.5px solid var(--lijn);
  border-radius: 9px;
  padding: 11px 14px;
  cursor: pointer;
  display: flex;
  gap: 12px;
  align-items: baseline;
  min-height: 44px;
}
.optie:hover:not(:disabled) { border-color: var(--bic); }
.optie .letter { font-family: var(--f-hand); font-weight: 700; font-size: 1.3rem; color: var(--bic); width: 1em; flex: none; }
.optie.gekozen { border-color: var(--bic); background: var(--bic-zacht); }
.optie.juist { border-color: var(--groen); background: var(--groen-zacht); }
.optie.onjuist { border-color: var(--rood); background: var(--rood-zacht); }
.optie:disabled { cursor: default; }
.antwoordveld {
  width: 100%;
  font-family: var(--f-code);
  font-size: 1rem;
  line-height: 1.55;
  padding: 10px 12px;
  border: 1.5px solid var(--lijn);
  border-radius: 8px;
  background: var(--kaart);
  color: var(--inkt);
  resize: vertical;
  min-height: 5.2em;
}
.antwoordveld:focus { border-color: var(--bic); outline: none; box-shadow: 0 0 0 3px var(--bic-zacht); }
.feedback { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: var(--r); border: 1.5px solid var(--lijn); background: var(--kaart); }
.feedback.goed { border-color: var(--groen); }
.feedback.fout { border-color: var(--rood); }
.feedback.info { border-color: var(--bic); }
.verschil { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 560px) { .verschil { grid-template-columns: minmax(0, 1fr); } }
.uitvoer .mis { background: var(--rood-zacht); color: var(--rood); }
.uitvoer .ok { background: var(--groen-zacht); }

/* ---------------- Stap voor stap ---------------- */
.stapper { display: flex; flex-direction: column; gap: 12px; }
.stapper-raster { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 640px) { .stapper-raster { grid-template-columns: minmax(0, 1fr); } }
.vars { display: flex; flex-direction: column; gap: 8px; }
.frame { border: 1px solid var(--lijn); border-radius: 8px; background: var(--kaart); overflow: hidden; }
.frame-kop { font-size: var(--t-xs); font-weight: 700; padding: 5px 10px; background: var(--code-bg); border-bottom: 1px solid var(--lijn); color: var(--inkt-zacht); }
.frame table { width: 100%; border-collapse: collapse; font-family: var(--f-code); font-size: 0.92rem; }
.frame td { padding: 4px 10px; border-top: 1px solid var(--lijn); vertical-align: top; }
.frame tr:first-child td { border-top: 0; }
.frame td:first-child { width: 40%; color: var(--inkt-zacht); }
.frame td.nieuw { background: var(--fluo); }
.frame .leeg { padding: 6px 10px; color: var(--inkt-flauw); font-family: var(--f-tekst); font-size: var(--t-s); font-style: italic; }
.stap-uitleg { font-size: var(--t-s); color: var(--inkt-zacht); min-height: 1.5em; }
.stap-uitleg b { color: var(--inkt); }
.tabelwrap { overflow-x: auto; border: 1px solid var(--lijn); border-radius: 8px; background: var(--kaart); }
.spoor { border-collapse: collapse; font-family: var(--f-code); font-size: 0.92rem; min-width: 100%; }
.spoor th, .spoor td { padding: 5px 10px; border-bottom: 1px solid var(--lijn); border-right: 1px solid var(--lijn); text-align: left; white-space: nowrap; font-variant-numeric: tabular-nums; }
.spoor th { background: var(--code-bg); font-weight: 600; color: var(--inkt-zacht); position: sticky; top: 0; }
.spoor td.zelfde { color: var(--inkt-flauw); }
.spoor td.veranderd { font-weight: 600; color: var(--inkt); }
.spoor td.out { color: var(--bic); }
.wissel { display: inline-flex; border: 1px solid var(--lijn); border-radius: 9px; overflow: hidden; }
.wissel button { appearance: none; border: 0; background: var(--kaart); color: var(--inkt-zacht); font: inherit; font-size: var(--t-s); font-weight: 600; padding: 7px 12px; cursor: pointer; }
.wissel button[aria-pressed="true"] { background: var(--bic-zacht); color: var(--bic); }

/* ---------------- Editor ---------------- */
.editor { display: grid; grid-template-columns: 2.8em minmax(0, 1fr); border: 1.5px solid var(--lijn); border-radius: 8px; background: var(--code-bg); overflow: hidden; }
.editor:focus-within { border-color: var(--bic); box-shadow: 0 0 0 3px var(--bic-zacht); }
.editor .gutter { font-family: var(--f-code); font-size: 0.95rem; line-height: 1.6; color: var(--inkt-flauw); text-align: right; padding: 10px 10px 10px 0; user-select: none; white-space: pre; overflow: hidden; font-variant-numeric: tabular-nums; }
.editor .gutter .fl { color: var(--rood); font-weight: 700; }
.editor textarea {
  font-family: var(--f-code);
  font-size: 0.95rem;
  line-height: 1.6;
  padding: 10px 12px;
  border: 0;
  outline: none;
  resize: vertical;
  background: transparent;
  color: var(--inkt);
  min-height: 11em;
  white-space: pre;
  overflow-x: auto;
  tab-size: 4;
  width: 100%;
}
.foutuitleg { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 8px; background: var(--rood-zacht); border: 1px solid var(--rood); }
.foutuitleg .titel { font-weight: 800; color: var(--rood); }
.foutuitleg .orig { font-family: var(--f-code); font-size: var(--t-s); color: var(--inkt-zacht); }
.testlijst { display: flex; flex-direction: column; gap: 6px; }
.test { display: grid; grid-template-columns: 1.6em minmax(0, 1fr); gap: 8px; align-items: start; padding: 8px 10px; border: 1px solid var(--lijn); border-radius: 8px; background: var(--kaart); font-size: var(--t-s); }
.test .ic { font-weight: 800; font-size: 1.1rem; line-height: 1.2; }
.test.ok .ic { color: var(--groen); }
.test.nok .ic { color: var(--rood); }
.test pre { margin: 0; font-family: var(--f-code); white-space: pre-wrap; word-break: break-word; }
.checklist { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.checklist li { display: flex; gap: 8px; align-items: flex-start; font-size: var(--t-s); }
.checklist li::before { content: "☐"; color: var(--bic); flex: none; }
.stappenplan { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.stap { display: flex; gap: 8px; align-items: flex-start; padding: 10px; border-radius: 8px; border: 1px solid var(--lijn); background: var(--kaart); font-size: var(--t-s); }
.stap .hand { font-size: 1.5rem; color: var(--bic); line-height: 1; }

/* ---------------- Spiekbrief ---------------- */
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { appearance: none; font: inherit; font-size: var(--t-s); font-weight: 600; border: 1.5px solid var(--lijn); background: var(--kaart); color: var(--inkt-zacht); border-radius: 99px; padding: 6px 12px; cursor: pointer; min-height: 36px; }
.filters button[aria-pressed="true"] { border-color: var(--bic); color: var(--bic); background: var(--bic-zacht); }
.vak { display: flex; flex-direction: column; gap: 10px; background: var(--kaart); border: 1px solid var(--lijn); border-radius: var(--r); padding: 16px; scroll-margin-top: 90px; }
.vak-kop { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.vak-kop .naam { font-family: var(--f-code); font-size: var(--t-s); color: var(--inkt-zacht); }
.sterren { color: var(--oranje); letter-spacing: 2px; font-size: 1rem; white-space: nowrap; }
.sterren .uit { color: var(--lijn); }
.twee-kol { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 640px) { .twee-kol { grid-template-columns: minmax(0, 1fr); } }
.lijstje { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; font-size: var(--t-s); }
.lijstje.weg { color: var(--inkt-zacht); }
.lijstje code { font-family: var(--f-code); font-size: 0.92em; }

/* ---------------- Voortgang ---------------- */
.dagen { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; }
.dag { aspect-ratio: 1; border-radius: 4px; background: var(--code-bg); border: 1px solid var(--lijn); max-width: 100%; }
.dag.n1 { background: color-mix(in srgb, var(--groen) 35%, var(--kaart)); border-color: transparent; }
.dag.n2 { background: color-mix(in srgb, var(--groen) 65%, var(--kaart)); border-color: transparent; }
.dag.n3 { background: var(--groen); border-color: transparent; }
.vg-rij { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 2fr) auto; gap: 12px; align-items: center; font-size: var(--t-s); }
.vg-rij .cnt { font-variant-numeric: tabular-nums; color: var(--inkt-zacht); white-space: nowrap; }
@media (max-width: 480px) { .vg-rij { grid-template-columns: minmax(0, 1fr) auto; } .vg-rij .balkje { grid-column: 1 / -1; grid-row: 2; } }
.overzicht-tekst { font-family: var(--f-code); font-size: var(--t-xs); white-space: pre-wrap; background: var(--code-bg); border: 1px solid var(--lijn); border-radius: 8px; padding: 10px 12px; max-height: 260px; overflow: auto; }

/* ---------------- Toast ---------------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--inkt);
  color: var(--papier);
  padding: 10px 16px;
  border-radius: 9px;
  font-weight: 600;
  font-size: var(--t-s);
  z-index: 30;
  max-width: calc(100% - 32px);
}
.verborgen-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.papierlabel { font-family: var(--f-hand); font-weight: 700; font-size: 1.3rem; line-height: 1.1; color: var(--bic); white-space: nowrap; flex: none; }

<script>
const DATA = {"niveaus":[{"nr":0,"titel":"Eerste stappen","kort":"Variabelen en print","spiek":["base-types","assignment","display","identifiers"],"doel":"Je weet wat een variabele is, wat `=` doet en wat `print` op het scherm zet.","uitleg":[{"titel":"Een programma is een lijstje opdrachten","tekst":"Python leest je programma **van boven naar onder** en voert de regels\néén voor één uit. Pas als een regel klaar is, komt de volgende.\n\nDat is het belangrijkste idee van heel het vak: als jij op papier\nprecies doet wat Python doet, regel per regel, dan weet je ook wat\ner gebeurt.","code":"print(\"Goeiemorgen\")\nprint(\"Tijd voor Python\")","uitvoer":"Goeiemorgen\nTijd voor Python\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[]}],"o":12},{"l":null,"fr":[{"f":"","v":[]}],"o":29,"end":true}]},{"titel":"print zet iets op het scherm","tekst":"Tekst tussen aanhalingstekens wordt **letterlijk** getoond. Zonder\naanhalingstekens rekent Python eerst uit wat er staat.\n\nZet je meerdere dingen in `print`, gescheiden door komma's, dan\nkomt er automatisch **één spatie** tussen.","code":"print(\"3 + 4\")\nprint(3 + 4)\nprint(\"Som:\", 3 + 4)","uitvoer":"3 + 4\n7\nSom: 7\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[]}],"o":6},{"l":3,"fr":[{"f":"","v":[]}],"o":8},{"l":null,"fr":[{"f":"","v":[]}],"o":15,"end":true}]},{"titel":"Een variabele is een doosje met een naam","tekst":"`x = 5` betekent: **steek 5 in het doosje met naam x**. Het is\ngeen wiskundige gelijkheid, het is een opdracht.\n\nPython werkt altijd zo:\n- eerst wordt **rechts** van `=` uitgerekend,\n- dan gaat het resultaat in de variabele **links**.\n\nDaarom kan `x = x + 1` gewoon: neem de oude x, tel 1 op, en steek\nhet resultaat terug in x. De oude waarde is dan weg.","code":"x = 5\nprint(x)\nx = x + 1\nprint(x)","papier":"Op papier: teken een tabel met een kolom per variabele. Schrijf bij\nelke toekenning de nieuwe waarde onder de vorige en streep de oude door.","uitvoer":"5\n6\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["x","5"]]}],"o":0},{"l":3,"fr":[{"f":"","v":[["x","5"]]}],"o":2},{"l":4,"fr":[{"f":"","v":[["x","6"]]}],"o":2},{"l":null,"fr":[{"f":"","v":[["x","6"]]}],"o":4,"end":true}]},{"titel":"Soorten waarden","tekst":"Elke waarde heeft een **type**. Op je spiekbrief staat dat bij\n*Base Types*:\n- `int`: een geheel getal, zoals `783`, `0` of `-192`\n- `float`: een kommagetal, met een **punt**: `9.23`, `0.0`\n- `str`: tekst, tussen aanhalingstekens: `\"Zeb\"`, `'hallo'`\n- `bool`: waar of onwaar: `True` of `False`\n\nLet op: `\"5\"` is tekst en `5` is een getal. Dat verschil komt nog\nvaak terug.","code":"print(type(5))\nprint(type(5.0))\nprint(type(\"5\"))\nprint(type(True))","uitvoer":"<class 'int'>\n<class 'float'>\n<class 'str'>\n<class 'bool'>\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[]}],"o":14},{"l":3,"fr":[{"f":"","v":[]}],"o":30},{"l":4,"fr":[{"f":"","v":[]}],"o":44},{"l":null,"fr":[{"f":"","v":[]}],"o":59,"end":true}]},{"titel":"Namen kiezen","tekst":"Een variabelenaam:\n- bestaat uit letters, cijfers en `_`\n- begint **niet** met een cijfer\n- heeft geen spaties\n- is geen Python-woord zoals `if`, `for` of `and`\n\nHoofdletters tellen: `Naam` en `naam` zijn twee verschillende variabelen.\nOp je spiekbrief (*Identifiers*) staan goede voorbeelden (`a`, `toto`,\n`x7`, `y_max`) en foute (`8y`, `and`, `for`)."},{"titel":"Twee waarden wisselen","tekst":"Op je spiekbrief staat `a, b = b, a` (*values swap*). Python rekent\neerst **beide** waarden rechts uit en steekt ze dan tegelijk in a en b.","code":"a = 3\nb = 8\na, b = b, a\nprint(a, b)","uitvoer":"8 3\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["a","3"]]}],"o":0},{"l":3,"fr":[{"f":"","v":[["a","3"],["b","8"]]}],"o":0},{"l":4,"fr":[{"f":"","v":[["a","8"],["b","3"]]}],"o":0},{"l":null,"fr":[{"f":"","v":[["a","8"],["b","3"]]}],"o":4,"end":true}]}],"oefeningen":[{"t":"voorspel","code":"print(\"Hallo Zeb\")\nprint(\"Welkom\")","uitleg":"Elke `print` zet zijn tekst op een **nieuwe regel**.","id":"0-1","uitvoer":"Hallo Zeb\nWelkom\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[]}],"o":10},{"l":null,"fr":[{"f":"","v":[]}],"o":17,"end":true}]},{"t":"voorspel","code":"x = 4\ny = x + 3\nprint(y)","uitleg":"Eerst krijgt x de waarde 4. Dan rekent Python `x + 3` uit, dus 7, en dat gaat in y.","id":"0-2","uitvoer":"7\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["x","4"]]}],"o":0},{"l":3,"fr":[{"f":"","v":[["x","4"],["y","7"]]}],"o":0},{"l":null,"fr":[{"f":"","v":[["x","4"],["y","7"]]}],"o":2,"end":true}]},{"t":"voorspel","code":"a = 10\na = a + 5\nprint(a)","uitleg":"Rechts eerst: `a + 5` is `10 + 5`, dus 15. Dat gaat terug in a. De oude 10 is weg.","id":"0-3","uitvoer":"15\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["a","10"]]}],"o":0},{"l":3,"fr":[{"f":"","v":[["a","15"]]}],"o":0},{"l":null,"fr":[{"f":"","v":[["a","15"]]}],"o":3,"end":true}]},{"t":"keuze","vraag":"Wat betekent `x = 7` in Python?","opties":["x is gelijk aan 7 (een vergelijking)","Steek de waarde 7 in de variabele x","Toon 7 op het scherm","Controleer of x gelijk is aan 7"],"juist":1,"uitleg":"Eén `=` is een **toekenning**: de waarde rechts gaat in de variabele links.\nOm te vergelijken gebruik je `==` (twee isgelijktekens). Dat zie je in niveau 3.","id":"0-4"},{"t":"voorspel","code":"print(\"3 + 4\")\nprint(3 + 4)","uitleg":"Tussen aanhalingstekens is het tekst, dus letterlijk `3 + 4`. Zonder aanhalingstekens rekent Python: 7.","id":"0-5","uitvoer":"3 + 4\n7\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[]}],"o":6},{"l":null,"fr":[{"f":"","v":[]}],"o":8,"end":true}]},{"t":"voorspel","code":"a = 2\nb = a\na = 5\nprint(a, b)","uitleg":"`b = a` kopieert de **waarde** die a op dat moment heeft (2) naar b.\nAls a daarna verandert, bl "leeftijd","18"]],"uitleg":"Je zet de variabele `leeftijd` tussen de twee stukken tekst. De komma's zorgen voor de spaties.","id":"0-10","ingevuld":"leeftijd = 18\nprint(\"Ik ben\", leeftijd, \"jaar\")","uitvoer":"Ik ben 18 jaar\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["leeftijd","18"]]}],"o":0},{"l":null,"fr":[{"f":"","v":[["leeftijd","18"]]}],"o":15,"end":true}]},{"t":"voorspel","code":"a = 3\nb = 8\na, b = b, a\nprint(a, b)","uitleg":"Dit is de *values swap* van je spiekbrief: a en b wisselen van waarde.","id":"0-11","uitvoer":"8 3\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["a","3"]]}],"o":0},{"l":3,"fr":[{"f":"","v":[["a","3"],["b","8"]]}],"o":0},{"l":4,"fr":[{"f":"","v":[["a","8"],["b","3"]]}],"o":0},{"l":null,"fr":[{"f":"","v":[["a","8"],["b","3"]]}],"o":4,"end":true}]},{"t":"voorspel","code":"x = 5\ny = x\nx = x + y\ny = x - y\nprint(x, y)","uitleg":"Stap voor stap: x=5, y=5, dan x=10, dan y=10-5=5. Volg het met een tabel.","tip":"Schrijf na elke regel de waarde van x én y op.","id":"0-12","uitvoer":"10 5\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["x","5"]]}],"o":0},{"l":3,"fr":[{"f":"","v":[["x","5"],["y","5"]]}],"o":0},{"l":4,"fr":[{"f":"","v":[["x","10"],["y","5"]]}],"o":0},{"l":5,"fr":[{"f":"","v":[["x","10"],["y","5"]]}],"o":0},{"l":null,"fr":[{"f":"","v":[["x","10"],["y","5"]]}],"o":5,"end":true}]},{"t":"schrijf","vraag":"Schrijf een programma dat:\n- in de variabele `prijs` de waarde 12 steekt,\n- in de variabele `aantal` de waarde 3 steekt,\n- en dan `Totaal: 36` toont, waarbij 36 **berekend** wordt.","oplossing":"prijs = 12\naantal = 3\nprint(\"Totaal:\", prijs * aantal)","uitleg":"Door `prijs * aantal` te schrijven in plaats van 36 werkt je programma ook als de prijs verandert.","ptests":[[[],"Totaal: 36"]],"id":"0-13"}]},{"nr":1,"titel":"Rekenen","kort":"+ - * / // % ** en math","spiek":["maths","assignment","base-types"],"doel":"Je kan elke r "kort":"str, input en omzetten","spiek":["base-types","input","conversions","display"],"doel":"Je kent het verschil tussen `\"5\"` en `5`, en je kan invoer vragen en omzetten naar een getal.","uitleg":[{"titel":"Tekst is een str","tekst":"Tekst (een *string*, kort `str`) staat tussen `\"...\"` of `'...'`.\nBeide mogen, als begin en einde maar hetzelfde zijn.\n\nMet tekst kan je ook \"rekenen\":\n- `+` plakt tekst aan elkaar\n- `*` herhaalt tekst\n- `len(...)` geeft het aantal tekens","code":"naam = \"Zeb\"\nprint(\"Dag \" + naam)\nprint(\"ha\" * 3)\nprint(len(naam))","uitvoer":"Dag Zeb\nhahaha\n3\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["naam","'Zeb'"]]}],"o":0},{"l":3,"fr":[{"f":"","v":[["naam","'Zeb'"]]}],"o":8},{"l":4,"fr":[{"f":"","v":[["naam","'Zeb'"]]}],"o":15},{"l":null,"fr":[{"f":"","v":[["naam","'Zeb'"]]}],"o":17,"end":true}]},{"titel":"input vraagt iets aan de gebruiker","tekst":"`input(\"vraag\")` toont de vraag, wacht tot de gebruiker iets intypt\nen Enter drukt, en geeft dat terug.\n\n**Belangrijk:** `input` geeft **altijd tekst** terug, ook als je een\ngetal intypt. Je spiekbrief zegt het ook: *input always returns a string*.","code":"antwoord = input(\"Hoe oud ben je? \")\nprint(antwoord * 2)","inputs":["18"],"papier":"Hier typte de gebruiker 18. Tekst maal 2 is de tekst twee keer: 1818.","uitvoer":"1818\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["antwoord","'18'"]]}],"o":0},{"l":null,"fr":[{"f":"","v":[["antwoord","'18'"]]}],"o":5,"end":true}]},{"titel":"Omzetten: int, float, str","tekst":"Om met invoer te rekenen, zet je de tekst om naar een getal\n(spiekbrief: *Conversions*):\n- `int(\"15\")` geeft `15`\n- `float(\"2.5\")` geeft `2.5`\n- `str(15)` geeft `\"15\"`\n- `int(15.56)` geeft `15`: de komma wordt gewoon **afgekapt**, niet afgerond\n\nHet vaste patroon voor een getal vragen is:\n`getal = int(input(\"Geef een getal: \"))`","code":"leeftijd = int(input(\"Hoe oud ben je? \"))\nprint(leeftijd + 1)\nprint(int(15.56))","inputs":["18"],"uitvoer":"19\n15\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["leeftijd","18"]]}],"o":0},{"l":3,"fr":[{"f":"","v":[["leeftijd","18"]]}],"o":3},{"l":null,"fr":[{"f":"","v":[["leeftijd","18"]]}],"o":6,"end":true}]},{"titel":"Tekst en getallen mengen","tekst":"`\"Ik ben \" + 18` geeft een **fout** (TypeError): je kan geen tekst\nen getal optellen. Twee oplossingen:\n- zet het getal om: `\"Ik ben \" + str(18)`\n- of gebruik komma's in `print`: `print(\"Ik ben\", 18)`","code":"leeftijd = 18\nprint(\"Ik ben \" + str(leeftijd) + \" jaar\")\nprint(\"Ik ben\", leeftijd, \"jaar\")","uitvoer":"Ik ben 18 jaar\nIk ben 18 jaar\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["leeftijd","18"]]}],"o":0},{"l":3,"fr":[{"f":"","v":[["leeftijd","18"]]}],"o":15},{"l":null,"fr":[{"f":"","v":[["leeftijd","18"]]}],"o":30,"end":true}]},{"titel":"print-opties: sep en end","tekst":"Normaal zet `print` een spatie tussen de stukken en springt het\ndaarna naar een nieuwe regel. Dat kan je veranderen (spiekbrief: *Display*):\n- `sep=\"-\"` verandert wat er tussen de stukken komt\n- `end=\"\"` zorgt dat de volgende print op dezelfde regel verdergaat","code":"print(\"a\", \"b\", \"c\")\nprint(\"a\", \"b\", \"c\", sep=\"-\")\nprint(\"x\", end=\"\")\nprint(\"y\")","uitvoer":"a b c\na-b-c\nxy\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[]}],"o":6},{"l":3,"fr":[{"f":"","v":[]}],"o":12},{"l":4,"fr":[{"f":"","v":[]}],"o":13},{"l":null,"fr":[{"f":"","v":[]}],"o":15,"end":true}]}],"oefeningen":[{"t":"voorspel","code":"print(\"ab\" + \"cd\")\nprint(\"ab\" * 3)","uitleg":"`+` plakt aan elkaar, `*` herhaalt.","id":"2-1","uitvoer":"abcd\nababab\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[]}],"o":5},{"l":null,"fr":[{"f":"","v":[]}],"o":12,"end":true}]},{"t":"voorspel","code":"print(\"5\" + \"3\")\nprint(5 + 3)","uitleg":"Tekst ],"o":0},{"l":3,"fr":[{"f":"","v":[["a","3"],["b","4"]]}],"o":0},{"l":null,"fr":[{"f":"","v":[["a","3"],["b","4"]]}],"o":2,"end":true}]},{"t":"voorspel","code":"woord = \"py\"\nzin = woord + \"thon\"\nprint(zin * 2, len(zin))","uitleg":"`zin` is `python` (6 tekens). Twee keer achter elkaar: `pythonpython`, dan een spatie en 6.","id":"2-11","uitvoer":"pythonpython 6\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["woord","'py'"]]}],"o":0},{"l":3,"fr":[{"f":"","v":[["woord","'py'"],["zin","'python'"]]}],"o":0},{"l":null,"fr":[{"f":"","v":[["woord","'py'"],["zin","'python'"]]}],"o":15,"end":true}]},{"t":"schrijf","vraag":"Schrijf een programma dat met `input` de naam van de gebruiker vraagt en daarna\n`Hallo <naam>!` toont. Typt de gebruiker `Zeb`, dan verschijnt: `Hallo Zeb!`","oplossing":"naam = input(\"Wat is je naam? \")\nprint(\"Hallo \" + naam + \"!\")","uitleg":"Let op de spaties: `print(\"Hallo\", naam, \"!\")` geeft `Hallo Zeb !`\n(met een spatie voor het uitroepteken). Met `+` heb je zelf de controle.","ptests":[[["Zeb"],"Hallo Zeb!"],[["An"],"Hallo An!"]],"id":"2-12"},{"t":"schrijf","vraag":"Vraag een aantal minuten (een geheel getal) en toon hoeveel uur en minuten dat is,\nin de vorm `2 u 15 min`. Bij 135 verschijnt dus `2 u 15 min`.","oplossing":"totaal = int(input(\"Aantal minuten: \"))\nprint(totaal // 60, \"u\", totaal % 60, \"min\")","uitleg":"Vergeet `int(...)` niet rond `input`, anders kan je niet rekenen.","ptests":[[["135"],"2 u 15 min"],[["59"],"0 u 59 min"],[["60"],"1 u 0 min"]],"id":"2-13"}]},{"nr":3,"titel":"Beslissen","kort":"if, elif, else, and, or","spiek":["boolean-logic","conditional","blocks"],"doel":"Je kan voorspellen welk blok van een if/elif/else wordt uitgevoerd en zelf voorwaarden schrijven.","uitleg":[{"titel":"Vergelijken geeft True of False","tekst":"Een vergelijking is een vraag met als antwoord `True` (waar) of `False` (onwaar):\n- `<` `>` `<=` `>=` kleiner, groter, kleiner of gelijk, groter of gelijk\n- `==` is gelijk aan\n- `!=` is niet gelijk aan\n\n**Valkuil nummer één:** `=` steekt iets in een variabele, `==` vergelijkt.","code":"x = 7\nprint(x > 5)\nprint(x == 5)\nprint(x != 5)","uitvoer":"True\nFalse\nTrue\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["x","7"]]}],"o":0},{"l":3,"fr":[{"f":"","v":[["x","7"]]}],"o":5},{"l":4,"fr":[{"f":"","v":[["x","7"]]}],"o":11},{"l":null,"fr":[{"f":"","v":[["x","7"]]}],"o":16,"end":true}]},{"titel":"if: alleen als het waar is","tekst":"`if voorwaarde:` voert het **ingesprongen blok** eronder uit, maar\nalleen als de voorwaarde waar is. Daarna gaat het programma gewoon verder.\n\nTwee dingen die je op papier niet mag vergeten:\n- de **dubbele punt** `:` op het einde van de if-regel\n- het **inspringen** (4 spaties) van alles wat bij de if hoort","code":"punten = 14\nif punten >= 10:\n    print(\"Geslaagd!\")\n    print(\"Proficiat\")\nprint(\"Einde\")","uitvoer":"Geslaagd!\nProficiat\nEinde\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["punten","14"]]}],"o":0},{"l":3,"fr":[{"f":"","v":[["punten","14"]]}],"o":0},{"l":4,"fr":[{"f":"","v":[["punten","14"]]}],"o":10},{"l":5,"fr":[{"f":"","v":[["punten","14"]]}],"o":20},{"l":null,"fr":[{"f":"","v":[["punten","14"]]}],"o":26,"end":true}]},{"titel":"if ... else","tekst":"Met `else:` geef je aan wat er moet gebeuren als de voorwaarde **niet**\nwaar is. Precies één van de twee blokken wordt uitgevoerd.","code":"n = 7\nif n % 2 == 0:\n    print(\"even\")\nelse:\n    print(\"oneven\")","uitvoer":"oneven\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["n","7"]]}],"o":0},{"l":5,"fr":[{"f":"","v":[["n","7"]]}],"o":0},{"l":null,"fr":[{"f":"","v":[["n","7"]]}],"o":7,"end":true}]},{"titel":"if ... elif ... else","tekst":"Met `elif` (kort voor *else if*) test je meerdere voorwaarden na elkaar.\nPython neemt **het eerste blok waarvan de voorwaarde waar is** en\nslaat de rest over. Zo staat het ook op je spiekbrief:\n*Only the block of first true condition is executed.*","code":"age = 70\nif age <= 18:\n    state = \"Kid\"\nelif age > 65:\n    state = \"Retired\"\nelse:\n    state = \"Active\"\nprint(state)","uitvoer":"Retired\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["age","70"]]}],"o":0},{"l":4,"fr":[{"f":"","v":[["age","70"]]}],"o":0},{"l":5,"fr":[{"f":"","v":[["age","70"]]}],"o":0},{"l":8,"fr":[{"f":"","v":[["age","70"],["state","'Retired'"]]}],"o":0},{"l":null,"fr":[{"f":"","v":[["age","70"],["state","'Retired'"]]}],"o":8,"end":true}]},{"titel":"and, or, not","tekst":"Voorwaarden combineren (spiekbrief: *Boolean Logic*):\n- `a and b` is waar als **allebei** waar zijn\n- `a or b` is waar als **minstens één** waar is\n- `not a` draait om: waar wordt onwaar en omgekeerd","code":"temp = 22\nzon = True\nprint(temp > 20 and zon)\nprint(temp > 30 or zon)\nprint(not zon)","uitvoer":"True\nTrue\nFalse\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["temp","22"]]}],"o":0},{"l":3,"fr":[{"f":"","v":[["temp","22"],["zon","True"]]}],"o":0},{"l":4,"fr":[{"f":"","v":[["temp","22"],["zon","True"]]}],"o":5},{"l":5,"fr":[{"f":"","v":[["temp","22"],["zon","True"]]}],"o":10},{"l":null,"fr":[{"f":"","v":[["temp","22"],["zon","True"]]}],"o":16,"end":true}]},{"titel":"Blokken en inspringen","tekst":"In Python bepaalt het **inspringen** wat bij elkaar hoort\n(spiekbrief: *Statements Blocks*). Alles wat even ver ingesprongen\nstaat onder een regel met `:`, hoort bij dat blok.\n\nOp papier: spring duidelijk in, bijvoorbeeld 2 hokjes. Je mag een\ndun verticaal lijntje trekken om te tonen waar het blok stopt.","code":"x = 3\nif x > 5:\n    print(\"groot\")\n    print(\"echt groot\")\nprint(\"klaar\")","papier":"x is niet groter dan 5, dus beide ingesprongen regels worden overgeslagen.","uitvoer":"klaar\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[["x","3"]]}],"o":0},{"l":5,"fr":[{"f":" ies":["Het toont 5","Het toont None","Een fout (NameError): y bestaat niet buiten de functie","Het toont niets"],"juist":2,"uitleg":"`y` is een **lokale** variabele van f. Buiten de functie bestaat y niet.","code":"def f():\n    y = 5\n\nf()\nprint(y)","id":"7-8","uitvoer":"","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":4,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[]},{"f":"f","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[]},{"f":"f","v":[["y","5"]]}],"o":0,"ret":["f","None"]},{"l":5,"fr":[{"f":"","v":[]}],"o":0},{"l":null,"fr":[{"f":"","v":[]}],"o":0,"end":true}],"fout":["NameError","name 'y' is not defined",5]},{"t":"fout","vraag":"Deze functie moet de oppervlakte van een rechthoek **teruggeven** (bij 3 en 4: 12). Na welke regel ontbreekt er iets?","code":"def oppervlakte(l, b):\n    opp = l * b\n\nprint(oppervlakte(3, 4))","regel":2,"verbeterd":"def oppervlakte(l, b):\n    opp = l * b\n    return opp\n\nprint(oppervlakte(3, 4))","uitleg":"Zonder `return` geeft de functie `None` terug. Na regel 2 moet `return opp` komen.","id":"7-9","uitvoer":"None\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":4,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[]},{"f":"oppervlakte","v":[["l","3"],["b","4"]]}],"o":0},{"l":2,"fr":[{"f":"","v":[]},{"f":"oppervlakte","v":[["l","3"],["b","4"],["opp","12"]]}],"o":0,"ret":["oppervlakte","None"]},{"l":null,"fr":[{"f":"","v":[]}],"o":5,"end":true}],"uitvoer_verbeterd":"12\n"},{"t":"aanvullen","vraag":"Vul aan zodat de functie True teruggeeft als n even is.","code":"def is_even(n):\n    ___ n % 2 == 0\n\nprint(is_even(4))","antwoorden":[["return"]],"uitleg":"`n % 2 == 0` is zelf al True of False. Dat kan je meteen teruggeven.","id":"7-10","ingevuld":"def is_even(n):\n    return n % 2 == 0\n\nprint(is_even(4))","uitvoer":"True\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":4,"fr":[{"f":"","v":[]}],"o":0},{"l":2,"fr":[{"f":"","v":[]},{"f":"is_even","v":[["n","4"]]}],"o":0},{"l":2,"fr":[{"f":"","v":[]},{"f":"is_even","v":[["n","4"]]}],"o":0,"ret":["is_even","True"]},{"l":null,"fr":[{"f":"","v":[]}],"o":5,"end":true}]},{"t":"voorspel","code":"def f(a, b):\n    a = a + b\n    return a * b\n\nx = 2\ny = f(x, 3)\nprint(x, y)","uitleg":"In f wordt de lokale a 2 + 3 = 5, en de functie geeft 5 · 3 = 15 terug. De x buiten de functie blijft 2.","tip":"Hou in je tabel de variabelen van f apart van die van het hoofdprogramma.","id":"7-11","uitvoer":"2 15\n","stappen":[{"l":1,"fr":[{"f":"","v":[]}],"o":0},{"l":5,"fr":[{"f":"","v":[]}],"o":0},{"l":6,"fr":[{"f":"","v":[["x","2"]]}],"o":0},{"l":2,"fr":[{"f":"","v":[["x","2"]]},{"f":"f","v":[["a","2"],["b","3"]]}],"o":0},{"l":3,"fr":[{"f":"","v":[["x","2"]]},{"f":"f","v":[["a","5"],["b","3"]]}],"o":0},{"l":3,"fr":[{"f":"","v":[["x","2"]]},{"f":"f","v":[["a","5"],["b","3"]]}],"o":0,"ret":["f","15"]},{"l":7,"fr":[{"f":"","v":[["x","2"],["y","15"]]}],"o":0},{"l":null,"fr":[{"f":"","v":[["x","2"],["y","15"]]}],"o":5,"end":true}]},{"t":"schrijf","vraag":"Schrijf een functie `oppervlakte_cirkel(r)` die de oppervlakte van een cirkel\nmet straal r **teruggeeft** (π · r²). Gebruik `from math import pi`.","oplossing":"from math import pi\n\ndef oppervlakte_cirkel(r):\n    return pi * r ** 2","uitleg":"`r ** 2` is r in het kwadraat. Geen print in de functie: het resultaat wordt teruggegeven.","tests":[["round(oppervlakte_cirkel(1), 4)","3.1416"],["round(oppervlakte_cirkel(2), 4)","12.5664"],["oppervlakte_cirkel(0)","0.0"]],"start":"from math import pi\n\ndef oppervlakte_cirkel(r):","id":"7-12"},{"t":"schrijf","vraag":"Schrijf een functie `aantal_even(lst)` die **teruggeeft** hoeveel even getallen\ner in de lijst zitten. `aantal_even([1, 2, 3, 4])` geeft `2`.","oplossing":"def aantal_even(lst):\n    aantal = 0\n    for x in lst:\n        if x % 2 == 0:\n            aantal += 1\n    return aantal","uitleg":"Teller op 0 vóór de lus, +1 als het getal even is, return **na** de lus (niet erin!).","tests":[["aantal_even([1, 2, 3, 4])","2"],["aantal_even([])","0"],["aantal_even([7, 9])","0"],["aantal_even([2, 2, 8])","3"]],"start":"def aantal_even(lst):","id":"7-13"},{"t":"schrijf","vraag":"Schrijf een functie `faculteit(n)` die n! teruggeeft: 1 · 2 · 3 · ... · n.\nAfspraak: `faculteit(0)` is 1. `faculteit(5)` is 120.","oplossing":"def faculteit(n):\n    resultaat = 1\n    for i in range(1, n + 1):\n        resultaat = resultaat * i\n    return resultaat","uitleg":"Bij vermenigvuldigen begin je met **1** (niet 0, want dan blijft alles 0).","tests":[["faculteit(0)","1"],["faculteit(1)","1"],["faculteit(5)","120"],["faculteit(10)","3628800"]],"start":"def faculteit(n):","id":"7-14"},{"t":"schrijf","vraag":"Schrijf een functie `grootste(lst)` die het grootste getal uit een (niet-lege)\nlijst teruggeeft, **zonder** `max` te gebruiken.","oplossing":"def grootste(lst):\n    g = lst[0]\n    for x in lst:\n        if x > g:\n            g = x\n    return g","uitleg":"Begin met het **eerste element** als voorlopig grootste, niet met 0:\nbij een lijst met enkel negatieve getallen zou 0 anders fout zijn.","tests":[["grootste([3, 9, 2])","9"],["grootste([-5, -2, -9])","-2"],["grootste([7])","7"]],"start":"def grootste(lst):","verboden":["max("],"uitdaging":true,"id":"7-15"}]}],"later":[{"nr":8,"titel":"Algoritmen met lijsten","kort":"zoeken, tellen, filteren","spiek":["for","generic-ops","list-ops"],"doel":"Lussen, lijsten en functies samen: de typische examenopgaven.","inhoud":"Zoeken in een lijst, maximum en minimum, tellen, filteren, lopen met index (`range(len(lst))`) en `enumerate`, twee lijsten vergelijken."},{"nr":9,"titel":"Tekst bewerken","kort":"split, join, upper, format","spiek":["string-ops","formatting","conversions"],"doel":"Tekst opsplitsen, samenvoegen en netjes opmaken.","inhoud":"Methodes zoals `split`, `join`, `upper`, `lower`, `strip`, `count`, `find` en `replace`; slices op tekst; opmaken met `format` en f-strings."},{"nr":10,"titel":"Woordenboeken en tuples","kort":"dict, tuple, set","spiek":["container-types","dict-ops","set-ops"],"doel":"Gegevens opslaan als sleutel → waarde.","inhoud":"Een dict maken en gebruiken, tellen met een dict, over sleutels en waarden lopen, tuples en uitpakken, sets."},{"nr":11,"titel":"Fouten en bestanden","kort":"try/except, open","spiek":["exceptions","files","imports"],"doel":"Foutmeldingen opvangen en tekstbestanden lezen of schrijven.","inhoud":"`try` / `except`, `raise`, een bestand openen met `with open(...)`, regel per regel lezen en schrijven."},{"nr":12,"titel":"Examentraining","kort":"proefexamens op papier","spiek":[],"doel":"Gemengde opgaven onder examenomstandigheden.","inhoud":"Proefexamens met timer, enkel je spiekbrief als hulp. Dit niveau bouwen we op met echte examenvragen van het vak."}],"spiekbrief":[{"id":"base-types","naam":"Base Types","nl":"Basistypes","kant":"voorkant","belang":3,"niveau":0,"uitleg":"De soorten enkelvoudige waarden. Elke waarde in Python heeft een type.","kennen":["`int`: geheel getal, zoals `783`, `0`, `-192`","`float`: kommagetal met een **punt**: `9.23`, `0.0`","`-1.7e-6` betekent -1,7 · 10⁻⁶ (wetenschappelijke notatie)","`bool`: `True` of `False` (met hoofdletter!)","`str`: tekst tussen `\"...\"` of `'...'`","`\\n` in een tekst betekent: nieuwe regel"],"overslaan":["`0b010`, `0o642`, `0xF3` (binair, octaal, hexadecimaal)","`bytes` (`b\"toto\"`)","tekst over meerdere regels met `\"\"\"`"],"code":"print(type(783), type(9.23))\nprint(type(True), type(\"Zeb\"))\nprint(-1.7e-6)\nprint(\"One\\nTwo\")","uitvoer":"<class 'int'> <class 'float'>\n<class 'bool'> <class 'str'>\n-1.7e-06\nOne\nTwo\n"},{"id":"container-types","naam":"Container Types","nl":"Containers: lijsten en co","kant":"voorkant","belang":2,"niveau":6,"uitleg":"Waarden die **meerdere** waarden bevatten. Bovenaan staan de *geordende\nreeksen* (met een index), onderaan de *sleutel-containers*.","kennen":["`list`: `[1, 5, 9]`, kan je aanpassen; `[]` is leeg","`tuple`: `(1, 5, 9)`, kan je **niet** aanpassen","`str` is ook een reeks: van letters","`dict`: `{\"sleutel\": \"waarde\"}` (komt in niveau 10)"],"overslaan":["`set` en `frozenset`","`bytes`","de opmerking over *hashable values*","`(\"mot\",)`: een tuple met één element heeft een komma nodig"],"code":"lst = [1, 5, 9]\ntup = (1, 5, 9)\nd = {\"één\": 1, \"twee\": 2}\nprint(lst[0], tup[1], d[\"twee\"])","uitvoer":"1 5 2\n"},{"id":"identifiers","naam":"Identifiers","nl":"Namen","kant":"voorkant","belang":2,"niveau":0,"uitleg":"De regels voor namen van variabelen en functies.","kennen":["letters, cijfers en `_`; niet beginnen met een cijfer","geen Python-woorden (`if`, `for`, `and`, ...)","hoofdletters tellen: `Naam` ≠ `naam`","goed: `a`, `toto`, `x7`, `y_max`, `BigOne`; fout: `8y`, `and`, `for`"],"overslaan":["accenten (*diacritics*) mogen, maar vermijd ze"]},{"id":"assignment","naam":"Variables assignment","nl":"Toekennen met =","kant":"voorkant","belang":3,"niveau":0,"uitleg":"`=` koppelt een naam aan een waarde. Python rekent **eerst de rechterkant\nuit** en steekt het resultaat daarna in de naam links.","kennen":["`x = 1.2 + 8`: rechts eerst uitrekenen","`a = b = c = 0`: drie variabelen tegelijk op 0","`y, z, r = 9.2, -7.6, 0`: meerdere tegelijk","`a, b = b, a`: twee waarden wisselen","`x += 3` is `x = x + 3`; zo ook `-=`, `*=`, `/=`, `%=`","`x = None`: een lege waarde, \"nog niets\""],"overslaan":["`a, *b = seq` (uitpakken met sterretje)","`del x`"],"code":"a = b = 0\ny, z = 9.2, -7.6\na, b = 3, 8\na, b = b, a\na += 3\nprint(a, b, y, z)","uitvoer":"11 3 9.2 -7.6\n"},{"id":"conversions","naam":"Conversions","nl":"Omzetten","kant":"voorkant","belang":3,"niveau":2,"uitleg":"Een waarde omzetten naar een ander type. Nodig na `input`, want dat geeft\naltijd tekst.","kennen":["`int(\"15\")` → `15`","`int(15.56)` → `15`: kapt af, rondt **niet** af!","`float(\"2.5\")` → `2.5`","`str(15)` → `\"15\"`","`round(15.56, 1)` → `15.6`","`list(\"abc\")` → `['a', 'b', 'c']`","`type(x)` toont het type"],"overslaan":["`int(\"3f\", 16)` (andere talstelsels)","`bool(x)`, `chr`/`ord`, `repr`, `bytes`","`dict(...)` en `set(...)`","`split` en `join` komen in niveau 9","`[int(x) for x in ...]` (list comprehension, later)"],"code":"print(int(\"15\") + 1)\nprint(int(15.56), round(15.56, 1))\nprint(float(\"2.5\") * 2, str(15) + \"!\")\nprint(list(\"abc\"))","uitvoer":"16\n15 15.6\n5.0 15!\n['a', 'b', 'c']\n"},{"id":"indexing","naam":"Sequence Containers Indexing","nl":"Index en slices","kant":"voorkant","belang":3,"niveau":6,"uitleg":"Hoe je één element of een stuk uit een lijst (of tekst) haalt. De tekening\nmet `lst = [10, 20, 30, 40, 50]` is het belangrijkste deel van deze kant.","kennen":["de index begint bij **0**: `lst[0]` → 10","negatief telt van achteren: `lst[-1]` → 50 (laatste)","`len(lst)` → 5; de laatste index is `len(lst) - 1`","`lst[1:3]` → `[20, 30]`: het einde zit er **niet** in","`lst[:3]` de eerste drie, `lst[3:]` vanaf index 3","`lst[::-1]` achterstevoren","`lst[4] = 25` verandert een element"],"overslaan":["`lst[::2]`, `lst[::-2]` (met stap)","`del lst[3:5]` en `lst[1:4] = [15, 25]`","*shallow copy* met `lst[:]`"],"code":"lst = [10, 20, 30, 40, 50]\nprint(lst[0], lst[-1], len(lst))\nprint(lst[1:3], lst[:3], lst[3:])\nprint(lst[::-1])","uitvoer":"10 50 5\n[20, 30] [10, 20, 30] [40, 50]\n[50, 40, 30, 20, 10]\n"},{"id":"boolean-logic","naam":"Boolean Logic","nl":"Waar of onwaar","kant":"voorkant","belang":3,"niveau":3,"uitleg":"Vergelijkingen geven `True` of `False`. Met `and`, `or` en `not`\ncombineer je ze.","kennen":["`<`, `>`, `<=`, `>=`, `==` (gelijk), `!=` (niet gelijk)","`a and b`: allebei waar","`a or b`: minstens één waar","`not a`: omgekeerd","`=` is toekennen, `==` is vergelijken"],"overslaan":["de *pitfall* over wat `and`/`or` teruggeven: gebruik ze gewoon met True/False"],"code":"a, b = 4, 9\nprint(a < b, a == b, a != b)\nprint(a > 3 and b > 10, a > 3 or b > 10, not a > 3)","uitvoer":"True False True\nFalse True False\n"},{"id":"blocks","naam":"Statements Blocks","nl":"Blokken en inspringen","kant":"voorkant","belang":3,"niveau":3,"uitleg":"Na een regel met `:` (if, for, while, def) komt een **blok** dat\ningesprongen staat. Alles wat even ver ingesprongen staat, hoort bij dat blok.","kennen":["dubbele punt `:` op het einde van de regel","4 spaties inspringen","het blok stopt waar het inspringen stopt","blokken kunnen in elkaar zitten (een if in een for)"],"overslaan":["de tip over je editor instellen"]},{"id":"imports","naam":"Modules/Names Imports","nl":"Importeren","kant":"voorkant","belang":2,"niveau":1,"uitleg":"Extra functies (zoals `sqrt`) zitten in **modules**. Die moet je eerst\nimporteren.","kennen":["`from math import sqrt, pi`: daarna gewoon `sqrt(16)`","`import math`: daarna `math.sqrt(16)`"],"overslaan":["`as` (hernoemen)","`sys.path`","een module is een bestand `truc.py`"],"code":"from math import sqrt, pi\nimport math\nprint(sqrt(16), math.sqrt(16), round(pi, 3))","uitvoer":"4.0 4.0 3.142\n"},{"id":"conditional","naam":"Conditional Statement","nl":"Als ... dan (if)","kant":"voorkant","belang":3,"niveau":3,"uitleg":"Een blok wordt alleen uitgevoerd als de voorwaarde waar is. Met `elif` en\n`else` kies je tussen meerdere gevallen: **alleen het eerste ware blok**\nwordt uitgevoerd.","kennen":["`if voorwaarde:` + ingesprongen blok","zoveel `elif` als je wil, maximaal één `else` op het einde","het voorbeeld met `age` en `state`"],"overslaan":["`if x:` als kortere versie van `if bool(x) == True:` (handig, maar niet nodig)"],"code":"age = 30\nif age <= 18:\n    state = \"Kid\"\nelif age > 65:\n    state = \"Retired\"\nelse:\n    state = \"Active\"\nprint(state)","uitvoer":"Active\n"},{"id":"maths","naam":"Maths","nl":"Rekenen","kant":"voorkant","belang":3,"niveau":1,"uitleg":"De rekenbewerkingen en de module `math`. Kommagetallen zijn **benaderingen**:\n`0.1 + 0.2` is niet exact `0.3`.\n\nKlein detail: op het blad staat `pow(4,3)→64.0`. In Python 3 geeft\n`pow(4, 3)` gewoon `64`; alleen `math.pow(4, 3)` geeft `64.0`.","kennen":["`+ - * /` en `**` (macht)","`//` gehele deling, `%` rest","voorrang: haakjes, dan `**`, dan `* / // %`, dan `+ -`","`abs(-3.2)` → 3.2, `round(3.57, 1)` → 3.6","`sqrt`, `floor`, `ceil`, `pi` uit `math`","hoeken in **radialen**"],"overslaan":["`@` (matrices)","`log`, `sin`, `cos` (tenzij je prof ze gebruikt)","de modules `statistics`, `random`, `decimal`, `numpy`"],"code":"from math import sqrt, floor, ceil\nprint(17 // 5, 17 % 5, 2 ** 10)\nprint(abs(-3.2), round(3.57, 1), sqrt(81))\nprint(floor(12.5), ceil(12.5), pow(4, 3))\nprint(0.1 + 0.2)","uitvoer":"3 2 1024\n3.2 3.6 9.0\n12 13 64\n0.30000000000000004\n"},{"id":"exceptions","naam":"Exceptions on Errors","nl":"Fouten opvangen","kant":"voorkant","belang":1,"niveau":null,"uitleg":"Een fout (*exception*) stopt normaal je programma. Met `try` / `except`\nvang je ze op. Dat komt in niveau 11.","kennen":["weten hoe een foutmelding eruitziet: `NameError`, `TypeError`, `IndexError`, ..."],"overslaan":["`raise`","`finally`","het schema met de pijlen"],"code":"try:\n    x = int(\"abc\")\nexcept ValueError:\n    print(\"Dat is geen getal\")","uitvoer":"Dat is geen getal\n"},{"id":"while","naam":"Conditional Loop Statement","nl":"Herhalen met while","kant":"achterkant","belang":3,"niveau":4,"uitleg":"Het blok wordt herhaald **zolang** de voorwaarde waar is. Het voorbeeld\nberekent de som van i² voor i van 1 tot 100.","kennen":["beginwaarde vóór de lus (`s = 0`, `i = 1`)","voorwaarde (`while i <= 100:`)","de variabele verandert in de lus (`i = i + 1`)","*beware of infinite loops*: verandert er niets, dan stopt de lus nooit"],"overslaan":["het sommatieteken Σ is gewoon de wiskundige uitleg"],"code":"s = 0\ni = 1\nwhile i <= 100:\n    s = s + i ** 2\n    i = i + 1\nprint(\"sum:\", s)","uitvoer":"sum: 338350\n"},{"id":"for","naam":"Iterative Loop Statement","nl":"Herhalen met for","kant":"achterkant","belang":3,"niveau":5,"uitleg":"Het blok wordt uitgevoerd **voor elk element** van een reeks. Er staan twee\nmanieren: over de **waarden** lopen en over de **indexen** lopen.","kennen":["`for c in s:`: over de waarden (voorbeeld: e's tellen)","`for idx in range(len(lst)):`: over de indexen, als je `lst[idx]` wil aanpassen","*good habit*: verander de lusvariabele niet zelf"],"overslaan":["`enumerate` (handig, komt in niveau 8)","lussen over een dict of set"],"code":"lst = [11, 18, 9, 12, 23, 4, 17]\nlost = []\nfor idx in range(len(lst)):\n    val = lst[idx]\n    if val > 15:\n        lost.append(val)\n        lst[idx] = 15\nprint(\"modif:\", lst, \"-lost:\", lost)","uitvoer":"modif: [11, 15, 9, 12, 15, 4, 15] -lost: [18, 23, 17]\n"},{"id":"loop-control","naam":"Loop Control","nl":"break en continue","kant":"achterkant","belang":2,"niveau":5,"uitleg":"Een lus vroeger stoppen of een ronde overslaan.","kennen":["`break`: stop de lus meteen","`continue`: sla de rest van deze ronde over"],"overslaan":["`else` na een lus"],"code":"for i in range(10):\n    if i == 2:\n        continue\n    if i == 5:\n        break\n    print(i, end=\" \")","uitvoer":"0 1 3 4 "},{"id":"display","naam":"Display","nl":"print","kant":"achterkant","belang":3,"niveau":0,"uitleg":"`print` toont waarden, variabelen en uitkomsten van berekeningen.","kennen":["komma's: er komt automatisch een spatie tussen","`sep=\"-\"`: iets anders dan een spatie ertussen","`end=\"\"`: niet naar een nieuwe regel springen"],"overslaan":["`file=sys.stdout`"],"code":"x, y = 3, 5\nprint(\"v=\", 3, \"cm :\", x, \",\", y + 4)\nprint(1, 2, 3, sep=\"-\")\nprint(\"op\", end=\" \")\nprint(\"één regel\")","uitvoer":"v= 3 cm : 3 , 9\n1-2-3\nop één regel\n"},{"id":"input","naam":"Input","nl":"input","kant":"achterkant","belang":3,"niveau":2,"uitleg":"`input` vraagt iets aan de gebruiker. Het geeft **altijd tekst** terug.","kennen":["`s = input(\"Vraag: \")` geeft een `str`","voor een getal: `int(input(...))` of `float(input(...))`"],"overslaan":[]},{"id":"generic-ops","naam":"Generic Operations on Containers","nl":"Functies voor lijsten en co","kant":"achterkant","belang":3,"niveau":6,"uitleg":"Functies die werken op lijsten, tuples, tekst, ... Een paar zie je heel vaak.","kennen":["`len(c)`, `min(c)`, `max(c)`, `sum(c)`","`sorted(c)`: een **nieuwe** gesorteerde lijst","`x in c` en `x not in c`","`c + c2` aan elkaar plakken, `c * 5` herhalen","`c.index(x)` positie, `c.count(x)` aantal keer"],"overslaan":["`enumerate` en `zip` (later)","`all`, `any`, `reversed`","`copy` en `deepcopy`"],"code":"c = [4, 8, 15, 16, 8]\nprint(len(c), min(c), max(c), sum(c))\nprint(sorted(c), 8 in c, 7 not in c)\nprint(c.index(15), c.count(8), [1, 2] + [3], [0] * 3)","uitvoer":"5 4 16 51\n[4, 8, 8, 15, 16] True True\n2 2 [1, 2, 3] [0, 0, 0]\n"},{"id":"range","naam":"Integer Sequences","nl":"range","kant":"achterkant","belang":3,"niveau":5,"uitleg":"`range(start, einde, stap)` maakt een reeks gehele getallen. **Het einde\nzit er nooit in.**","kennen":["`range(5)` → 0 1 2 3 4","`range(3, 8)` → 3 4 5 6 7","`range(2, 12, 3)` → 2 5 8 11","`range(20, 5, -5)` → 20 15 10","`range(len(seq))` → alle indexen van seq"],"overslaan":["*immutable sequence ... constructed as needed*"],"code":"print(*range(5))\nprint(*range(3, 8))\nprint(*range(2, 12, 3))\nprint(*range(20, 5, -5))","uitvoer":"0 1 2 3 4\n3 4 5 6 7\n2 5 8 11\n20 15 10\n"},{"id":"list-ops","naam":"Operations on Lists","nl":"Lijsten aanpassen","kant":"achterkant","belang":3,"niveau":6,"uitleg":"Methodes die de lijst **zelf** veranderen.","kennen":["`lst.append(x)`: achteraan toevoegen","`lst.insert(i, x)`: invoegen op index i","`lst.remove(x)`: eerste x verwijderen","`lst.pop()`: laatste verwijderen en teruggeven","`lst.sort()`: de lijst zelf sorteren"],"overslaan":["`extend`, `reverse`"],"code":"lst = [3, 1, 2]\nlst.append(5)\nlst.insert(0, 9)\nlst.remove(1)\nx = lst.pop()\nlst.sort()\nprint(lst, x)","uitvoer":"[2, 3, 9] 5\n"},{"id":"def","naam":"Function Definition","nl":"Een functie maken","kant":"achterkant","belang":3,"niveau":7,"uitleg":"Met `def` maak je een functie: een **zwarte doos** met invoer\n(parameters) en uitvoer (`return`).","kennen":["`def naam(x, y):` met dubbele punt","`return res` geeft het resultaat terug","zonder return geeft de functie `None` terug","variabelen in de functie bestaan alleen in die functie"],"overslaan":["de documentatie tussen `\"\"\"`: mag, moet niet","*Advanced*: `*args`, `**kwargs`","standaardwaarden zoals `a=3` (handig, maar later)"],"code":"def fct(x, y, z):\n    \"\"\"telt drie getallen op\"\"\"\n    res = x + y + z\n    return res\n\nprint(fct(1, 2, 3))","uitvoer":"6\n"},{"id":"call","naam":"Function Call","nl":"Een functie aanroepen","kant":"achterkant","belang":3,"niveau":7,"uitleg":"Een functie doet pas iets als je ze **aanroept**: naam plus haakjes.","kennen":["`r = fct(3, i + 2, 2 * i)`: het resultaat in r steken","één argument per parameter, in dezelfde volgorde","zonder haakjes wordt de functie niet uitgevoerd"],"overslaan":["*Advanced*: `*sequence`, `**dict`"],"code":"def fct(a, b, c):\n    return a * 100 + b * 10 + c\n\ni = 2\nr = fct(3, i + 2, 2 * i)\nprint(r)","uitvoer":"344\n"},{"id":"dict-ops","naam":"Operations on Dictionaries","nl":"Woordenboeken","kant":"achterkant","belang":2,"niveau":null,"uitleg":"Een dict koppelt **sleutels** aan **waarden**, zoals een woordenboek.\nKomt in niveau 10.","kennen":["`d[sleutel] = waarde`: toevoegen of aanpassen","`d[sleutel]`: opzoeken","`d.get(sleutel, standaard)`: opzoeken zonder fout","`d.keys()`, `d.values()`, `d.items()`"],"overslaan":["`update`, `pop`, `popitem`, `setdefault`, `clear`"],"code":"punten = {\"Zeb\": 14, \"Lies\": 16}\npunten[\"Tom\"] = 12\nprint(punten[\"Zeb\"], punten.get(\"An\", 0))\nfor naam, p in punten.items():\n    print(naam, p)","uitvoer":"14 0\nZeb 14\nLies 16\nTom 12\n"},{"id":"set-ops","naam":"Operations on Sets","nl":"Verzamelingen","kant":"achterkant","belang":1,"niveau":null,"uitleg":"Een set is een verzameling zonder dubbels en zonder volgorde. Met de\nbewerkingen van de wiskunde: unie `|`, doorsnede `&`, verschil `-`.","kennen":["dat een set geen dubbels bevat"],"overslaan":["al de rest, tot je prof er een oefening over geeft"],"code":"a = {1, 2, 3}\nb = {2, 3, 4}\nprint(a | b, a & b, a - b)","uitvoer":"{1, 2, 3, 4} {2, 3} {1}\n"},{"id":"string-ops","naam":"Operations on Strings","nl":"Tekst bewerken","kant":"achterkant","belang":2,"niveau":null,"uitleg":"Methodes voor tekst. Ze geven altijd een **nieuwe** tekst terug; de\noorspronkelijke tekst verandert niet. Komt in niveau 9.","kennen":["`s.upper()`, `s.lower()`","`s.strip()`: spaties vooraan en achteraan weg","`s.split(\",\")`: opsplitsen in een lijst","`\",\".join(lijst)`: lijst samenvoegen tot tekst","`s.count(\"e\")`, `s.find(\"e\")`, `s.startswith(\"a\")`"],"overslaan":["`partition`, `casefold`, `center`, `ljust`, `rjust`, `zfill`, `encode`, `swapcase`"],"code":"s = \"  Python op papier  \"\nprint(s.strip().upper())\nprint(\"1,4,8,2\".split(\",\"))\nprint(\"-\".join([\"a\", \"b\", \"c\"]))\nprint(\"programmeren\".count(\"r\"))","uitvoer":"PYTHON OP PAPIER\n['1', '4', '8', '2']\na-b-c\n3\n"},{"id":"files","naam":"Files","nl":"Bestanden","kant":"achterkant","belang":1,"niveau":null,"uitleg":"Tekst opslaan in een bestand en terug inlezen. Komt in niveau 11.","kennen":["`with open(\"file.txt\", \"r\", encoding=\"utf8\") as f:` (onderaan rechts)","`for line in f:` leest regel per regel","modes: `\"r\"` lezen, `\"w\"` schrijven, `\"a\"` toevoegen"],"overslaan":["`seek`, `tell`, `flush`, `truncate`","binaire modus `b`"]},{"id":"formatting","naam":"Formatting","nl":"Opmaak","kant":"achterkant","belang":1,"niveau":null,"uitleg":"Getallen netjes in tekst zetten, bijvoorbeeld met 2 cijfers na de komma.","kennen":["`\"{:.2f}\".format(x)`: 2 cijfers na de komma","`\"{} en {}\".format(a, b)`: waarden invullen"],"overslaan":["alle andere codes (`!r`, `>10s`, `+2.3f`, ...)"],"code":"x = 45.72793\nprint(\"{:.2f}\".format(x))\nprint(\"{} en {}\".format(\"Zeb\", 18))","uitvoer":"45.73\nZeb en 18\n"}],"instaptest":[{"n":0,"t":"voorspel","code":"x = 3\nx = x + 2\n const RUNNER_PY = "# Draait in de browser (Brython, in een Web Worker).\n# Voert code van de leerling uit en test ze. Geeft altijd JSON-tekst terug.\nimport sys\nimport json\nimport traceback\nfrom browser import self as W\n\n\nclass Uit:\n    def __init__(self):\n        self.buf = []\n\n    def write(self, s):\n        self.buf.append(str(s))\n\n    def flush(self):\n        pass\n\n\ndef _foutinfo(e):\n    ln = getattr(e, \"lineno\", None)\n    try:\n        for fr in traceback.extract_tb(e.__traceback__):\n            if fr.filename == \"<zeb>\":\n                ln = fr.lineno\n    except Exception:\n        pass\n    msg = str(e)\n    if isinstance(e, SyntaxError):\n        msg = getattr(e, \"msg\", None) or msg\n    return [type(e).__name__, msg, ln]\n\n\ndef _voer_uit(src, inputs, echo):\n    uit = Uit()\n    voeding = list(inputs)\n\n    def nep_input(prompt=\"\"):\n        if echo:\n            uit.write(str(prompt))\n        if not voeding:\n            raise EOFError(\"Er is geen invoer meer om te lezen.\")\n        v = voeding.pop(0)\n        if echo:\n            uit.write(v + \"\\n\")\n        return v\n\n    g = {\"__name__\": \"__main__\", \"input\": nep_input}\n    oud = sys.stdout\n    sys.stdout = uit\n    fout = None\n    try:\n        exec(compile(src, \"<zeb>\", \"exec\"), g)\n    except BaseException as e:\n        fout = _foutinfo(e)\n    finally:\n        sys.stdout = oud\n    return g, \"\".join(uit.buf), fout\n\n\ndef _norm(s):\n    lijnen = [ln.rstrip() for ln in s.replace(\"\\r\", \"\").split(\"\\n\")]\n    while lijnen and lijnen[-1] == \"\":\n        lijnen.pop()\n    return \"\\n\".join(lijnen)\n\n\ndef zeb_run(src, inputs_json):\n    _, uit, fout = _voer_uit(src, json.loads(inputs_json), True)\n    return json.dumps({\"uit\": uit, \"fout\": fout})\n\n\ndef zeb_test(src, tests_json, ptests_json):\n    tests = json.loads(tests_json)\n    ptests = json.loads(ptests_json)\n    resultaten = []\n    algemene_fout = None\n    if tests:\n        g, uit, fout = _voer_uit(src, [], False)\n        if fout:\n            algemene_fout = fout\n        else:\n            for expr, verwacht in tests:\n                r = {\"vraag\": expr, \"verwacht\": verwacht}\n                try:\n                    waarde = eval(expr, g)\n                    r[\"kreeg\"] = repr(waarde)\n                    r[\"ok\"] = waarde == eval(verwacht)\n                except BaseException as e:\n                    r[\"fout\"] = _foutinfo(e)\n                    r[\"ok\"] = False\n                resultaten.append(r)\n    for inputs, verwacht in ptests:\n        _, uit, fout = _voer_uit(src, inputs, False)\n        r = {\"invoer\": inputs, \"verwacht\": verwacht, \"kreeg\": uit}\n        if fout:\n            r[\"fout\"] = fout\n        r[\"ok\"] = (fout is None) and _norm(uit) == _norm(verwacht)\n        resultaten.append(r)\n    return json.dumps({\"resultaten\": resultaten, \"fout\": algemene_fout})\n\n\nW.zebRun = zeb_run\nW.zebTest = zeb_test\n";
</script>

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

    return String(s)
      .split(/(`[^`]+`)/g)
      .map((deel) => {
        if (deel.startsWith("`") && deel.endsWith("`") && deel.length > 1) {
          return "<code>" + esc(deel.slice(1, -1)) + "</code>";

        return esc(deel)
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")

  function md(tekst) {
    if (!tekst) return "";

    return blokken
      .map((blok) => {
        const regels = blok.split("\n");
        let html = "";
        let lijst = null; // {tag, items}
        let para = [];
        const sluitPara = () => {
          if (para.length) html += "<p>" + inline(para.join(" ")) + "</p>";
          para = [];
        };
        const sluitLijst = () => {
          if (lijst) html += `<${lijst.tag}>` + lijst.items.map((i) => "<li>" + inline(i) + "</li>").join("") + `</${lijst.tag}>`;
          lijst = null;
        };
        for (const r of regels) {
          const ul = r.match(/^\s*-\s+(.*)$/);
          const ol = r.match(/^\s*\d+\.\s+(.*)$/);
          if (ul || ol) {
            sluitPara();
            const tag = ul ? "ul" : "ol";
            if (!lijst || lijst.tag !== tag) {
              sluitLijst();
              lijst = { tag, items: [] };
            }
            lijst.items.push((ul || ol)[1]);
          } else if (lijst && /^\s+\S/.test(r)) {
            lijst.items[lijst.items.length - 1] += " " + r.trim();
          } else {
            sluitLijst();
            if (r.trim()) para.push(r.trim());
          }
        }
        sluitPara();
        sluitLijst();
        return html;

  const TOK = /(#.*$)|("(?:\\.|[^"\\])*"?|'(?:\\.|[^'\\])*'?)|(\b\d+(?:\.\d+)?(?:e[+-]?\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|(\s+)|([^])/g;
  function hl(regel) {
    let uit = "";
    regel.replace(TOK, (m, com, str, num, naam, ws) => {
      if (com) uit += `<span class="tk-com">${esc(com)}</span>`;
      else if (str) uit += `<span class="tk-str">${esc(str)}</span>`;
      else if (num) uit += `<span class="tk-num">${esc(num)}</span>`;
      else if (naam) {
        if (KW.has(naam)) uit += `<span class="tk-kw">${naam}</span>`;
        else if (BI.has(naam)) uit += `<span class="tk-bi">${naam}</span>`;

  function codeHTML(code, opt) {
