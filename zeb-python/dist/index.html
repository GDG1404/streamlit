}],"fout":["KeyError","'y'",2]},{"t":"voorspel","code":"woorden = [\"kat\", \"hond\", \"kat\", \"vis\", \"kat\"]\nteller = {}\nfor w in woorden:\n    teller[w] = teller.get(w, 0) + 1\nprint(teller)","uitleg":"Elk woord krijgt een teller. `kat` komt 3 keer voor.","id":"dictionaries-5","uitvoer":"{'kat': 3, 'hond': 1, 'vis': 1}\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[["woorden","['kat', 'hond', 'kat', 'vis', 'kat']"]]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[["woorden","['kat', 'hond', 'kat', 'vis', 'kat']"],["teller","{}"]]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[["woorden","['kat', 'hond', 'kat', 'vis', 'kat']"],["teller","{}"],["w","'kat'"]]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[["woorden","['kat', 'hond', 'kat', 'vis', 'kat']"],["teller","{'kat': 1}"],["w","'kat'"]]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[["woorden","['kat', 'hond', 'kat', 'vis', 'kat']"],["teller","{'kat': 1}"],["w","'hond'"]]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[["woorden","['kat', 'hond', 'kat', 'vis', 'kat']"],["teller","{'kat': 1, 'hond': 1}"],["w","'hond'"]]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[["woorden","['kat', 'hond', 'kat', 'vis', 'kat']"],["teller","{'kat': 1, 'hond': 1}"],["w","'kat'"]]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[["woorden","['kat', 'hond', 'kat', 'vis', 'kat']"],["teller","{'kat': 2, 'hond': 1}"],["w","'kat'"]]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[["woorden","['kat', 'hond', 'kat', 'vis', 'kat']"],["teller","{'kat': 2, 'hond': 1}"],["w","'vis'"]]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[["woorden","['kat', 'hond', 'kat', 'vis', 'kat']"],["teller","{'kat': 2, 'hond': 1, 'vis': 1}"],["w","'vis'"]]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[["woorden","['kat', 'hond', 'kat', 'vis', 'kat']"],["teller","{'kat': 2, 'hond': 1, 'vis': 1}"],["w","'kat'"]]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[["woorden","['kat', 'hond', 'kat', 'vis', 'kat']"],["teller","{'kat': 3, 'hond': 1, 'vis': 1}"],["w","'kat'"]]}],"o":0},{"l":5,"fr":[{"f":"","l":5,"v":[["woorden","['kat', 'hond', 'kat', 'vis', 'kat']"],["teller","{'kat': 3, 'hond': 1, 'vis': 1}"],["w","'kat'"]]}],"o":0},{"l":null,"fr":[{"f":"","l":null,"v":[["woorden","['kat', 'hond', 'kat', 'vis', 'kat']"],["teller","{'kat': 3, 'hond': 1, 'vis': 1}"],["w","'kat'"]]}],"o":32,"end":true}]},{"t":"keuze","vraag":"Welke van deze kan **geen** key van een dictionary zijn?","opties":["\"tekst\"","42","(1, 2)","[1, 2]"],"juist":3,"uitleg":"Keys moeten onveranderbaar zijn. Een list kan veranderen, een tuple niet.","id":"dictionaries-6"},{"t":"voorspel","code":"a = {\"x\": 1}\nb = a\nc = a.copy()\nb[\"x\"] = 5\nprint(a[\"x\"], c[\"x\"])","uitleg":"`b = a` is een alias, dus a verandert mee. `c` is een echte kopie en blijft 1.","id":"dictionaries-7","uitvoer":"5 1\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[["a","{'x': 1}"]]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[["a","{'x': 1}"],["b","{'x': 1}"]]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[["a","{'x': 1}"],["b","{'x': 1}"],["c","{'x': 1}"]]}],"o":0},{"l":5,"fr":[{"f":"","l":5,"v":[["a","{'x': 5}"],["b","{'x': 5}"],["c","{'x': 1}"]]}],"o":0},{"l":null,"fr":[{"f":"","l":null,"v":[["a","{'x': 5}"],["b","{'x': 5}"],["c","{'x': 1}"]]}],"o":4,"end":true}]},{"t":"fout","vraag":"Dit programma moet tellen hoe vaak elk woord voorkomt. Op welke regel loopt het mis?","code":"woorden = [\"kat\", \"hond\", \"kat\"]\nteller = {}\nfor w in woorden:\n    teller[w] += 1\nprint(teller)","regel":4,"verbeterd":"woorden = [\"kat\", \"hond\", \"kat\"]\nteller = {}\nfor w in woorden:\n    teller[w] = teller.get(w, 0) + 1\nprint(teller)","uitleg":"De eerste keer bestaat de key nog niet, dus `teller[w] += 1` geeft een KeyError. Start bij 0 met `get`, of test met `in`.","id":"dictionaries-8","uitvoer":"","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[["woorden","['kat', 'hond', 'kat']"]]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[["woorden","['kat', 'hond', 'kat']"],["teller","{}"]]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[["woorden","['kat', 'hond', 'kat']"],["teller","{}"],["w","'kat'"]]}],"o":0},{"l":null,"fr":[{"f":"","l":null,"v":[["woorden","['kat', 'hond', 'kat']"],["teller","{}"],["w","'kat'"]]}],"o":0,"end":true}],"fout":["KeyError","'kat'",4],"uitvoer_verbeterd":"{'kat': 2, 'hond': 1}\n"},{"t":"schrijf","vraag":"Schrijf een functie `tel_woorden(lst)` die een dictionary teruggeeft met elk woord\nuit de list als key en het aantal keer dat het voorkomt als waarde.","oplossing":"def tel_woorden(lst):\n    teller = {}\n    for w in lst:\n        if w in teller:\n            teller[w] += 1\n        else:\n            teller[w] = 1\n    return teller","uitleg":"Het tel-patroon: nieuwe key op 1 zetten, bestaande key verhogen.","tests":[["tel_woorden(['a', 'b', 'a'])","{'a': 2, 'b': 1}"],["tel_woorden([])","{}"],["tel_woorden(['x', 'x', 'x'])","{'x': 3}"]],"start":"def tel_woorden(lst):","boek":"Opgave in 13.2.4","id":"dictionaries-9"},{"t":"schrijf","vraag":"Schrijf een functie `vertaal(zin, woordenboek)` die een zin woord voor woord vertaalt.\nEen woord dat niet in het woordenboek staat, blijft gewoon staan.\n`vertaal(\"the cat sleeps\", {\"the\": \"de\", \"cat\": \"kat\"})` geeft `\"de kat sleeps\"`.","oplossing":"def vertaal(zin, woordenboek):\n    nieuw = []\n    for w in zin.split():\n        nieuw.append(woordenboek.get(w, w))\n    return \" \".join(nieuw)","uitleg":"`get(w, w)` geeft de vertaling, of het woord zelf als er geen vertaling is.","tests":[["vertaal('the cat sleeps', {'the': 'de', 'cat': 'kat'})","'de kat sleeps'"],["vertaal('hello', {})","'hello'"]],"start":"def vertaal(zin, woordenboek):","boek":"Opgave in 13.2.4","id":"dictionaries-10"},{"t":"schrijf","vraag":"Een dictionary bevat per film een list met scores:\n`{\"Film A\": [8, 7, 9], \"Film B\": [6, 5]}`. Schrijf een functie `gemiddelden(d)` die een\n**nieuwe** dictionary teruggeeft met per film het gemiddelde, afgerond op 1 decimaal.","oplossing":"def gemiddelden(d):\n    resultaat = {}\n    for film, scores in d.items():\n        resultaat[film] = round(sum(scores) / len(scores), 1)\n    return resultaat","uitleg":"Loop met `items()` over de films, en bewaar het gemiddelde onder dezelfde key.","tests":[["gemiddelden({'Film A': [8, 7, 9], 'Film B': [6, 5]})","{'Film A': 8.0, 'Film B': 5.5}"],["gemiddelden({})","{}"]],"start":"def gemiddelden(d):","boek":"Opgave 13.2","id":"dictionaries-11"},{"t":"schrijf","vraag":"Schrijf een functie `tel_letters(s)` die een dictionary teruggeeft met hoe vaak elke\n**letter** voorkomt. Hoofdletters tellen als kleine letters; tekens die geen letter\nzijn, sla je over. `tel_letters(\"Aap!\")` geeft `{\"a\": 2, \"p\": 1}`.","oplossing":"def tel_letters(s):\n    teller = {}\n    for c in s.lower():\n        if c.isalpha():\n            teller[c] = teller.get(c, 0) + 1\n    return teller","uitleg":"`lower()` eerst, `isalpha()` om enkel letters te tellen.","tests":[["tel_letters('Aap!')","{'a': 2, 'p': 1}"],["tel_letters('123')","{}"]],"start":"def tel_letters(s):","uitdaging":true,"boek":"Opgave 13.1 (vereenvoudigd)","id":"dictionaries-12"}],"nr":11},{"key":"sets","titel":"Sets","kort":"verzamelingen zonder dubbels","hoofdstuk":"14","spiek":["set-ops","container-types"],"doel":"Je weet wat een set is en kan vereniging, doorsnede en verschil gebruiken.","uitleg":[{"titel":"Set basis","tekst":"Een **set** is een verzameling, zoals in de wiskunde (cursus 14.1):\n- elk element komt er **maar één keer** in voor\n- er is **geen vaste volgorde**, dus ook geen index\n\nJe schrijft een set met accolades: `{1, 2, 3}`. Een **lege** set maak je\nmet `set()`, want `{}` is een lege dictionary! Met `set(...)` maak je een\nset van een string of list: de dubbels verdwijnen.","code":"s = {3, 1, 3, 2, 1}\nprint(len(s))\nletters = set(\"banaan\")\nprint(sorted(letters))\nprint(2 in s)","papier":"Omdat een set geen volgorde heeft, gebruiken we `sorted()` om hem netjes te tonen.","uitvoer":"3\n['a', 'b', 'n']\nTrue\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[["s","{1, 2, 3}"]]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[["s","{1, 2, 3}"]]}],"o":2},{"l":4,"fr":[{"f":"","l":4,"v":[["s","{1, 2, 3}"],["letters","{'n', 'a', 'b'}"]]}],"o":2},{"l":5,"fr":[{"f":"","l":5,"v":[["s","{1, 2, 3}"],["letters","{'n', 'a', 'b'}"]]}],"o":18},{"l":null,"fr":[{"f":"","l":null,"v":[["s","{1, 2, 3}"],["letters","{'n', 'a', 'b'}"]]}],"o":23,"end":true}]},{"titel":"Set methodes","tekst":"Een set aanpassen (cursus 14.2):\n- `s.add(x)` voegt één element toe, `s.update(lst)` meerdere\n- `s.remove(x)` verwijdert x, maar geeft een **KeyError** als x er niet in zit\n- `s.discard(x)` verwijdert x als het erin zit, **zonder** fout\n- `s.clear()` maakt de set leeg, `s.copy()` maakt een kopie","code":"s = {1, 2}\ns.add(2)\ns.add(5)\ns.update([7, 8])\ns.discard(100)\ns.remove(1)\nprint(sorted(s))","uitvoer":"[2, 5, 7, 8]\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[["s","{1, 2}"]]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[["s","{1, 2}"]]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[["s","{1, 2, 5}"]]}],"o":0},{"l":5,"fr":[{"f":"","l":5,"v":[["s","{1, 2, 5, 7, 8}"]]}],"o":0},{"l":6,"fr":[{"f":"","l":6,"v":[["s","{1, 2, 5, 7, 8}"]]}],"o":0},{"l":7,"fr":[{"f":"","l":7,"v":[["s","{2, 5, 7, 8}"]]}],"o":0},{"l":null,"fr":[{"f":"","l":null,"v":[["s","{2, 5, 7, 8}"]]}],"o":13,"end":true}]},{"titel":"Verzamelingen combineren","tekst":"Zoals in de wiskunde (cursus 14.2.5 tot 14.2.7):\n- **vereniging**: `a.union(b)` of `a | b`: alles wat in a **of** b zit\n- **doorsnede**: `a.intersection(b)` of `a & b`: wat in a **en** b zit\n- **verschil**: `a.difference(b)` of `a - b`: wat in a zit maar niet in b","code":"a = {1, 2, 3}\nb = {2, 3, 4}\nprint(sorted(a | b))\nprint(sorted(a & b))\nprint(sorted(a - b), sorted(b - a))","uitvoer":"[1, 2, 3, 4]\n[2, 3]\n[1] [4]\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[["a","{1, 2, 3}"]]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[["a","{1, 2, 3}"],["b","{2, 3, 4}"]]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[["a","{1, 2, 3}"],["b","{2, 3, 4}"]]}],"o":13},{"l":5,"fr":[{"f":"","l":5,"v":[["a","{1, 2, 3}"],["b","{2, 3, 4}"]]}],"o":20},{"l":null,"fr":[{"f":"","l":null,"v":[["a","{1, 2, 3}"],["b","{2, 3, 4}"]]}],"o":28,"end":true}]},{"titel":"Deelverzamelingen","tekst":"(cursus 14.2.8)\n- `a.issubset(b)`: zit alles van a ook in b?\n- `a.issuperset(b)`: zit alles van b ook in a?\n- `a.isdisjoint(b)`: hebben a en b **niets** gemeen?\n\nEen **frozenset** (cursus 14.3) is een set die je niet kan veranderen,\nzoals een tuple een list is die je niet kan veranderen.","code":"print({1, 2}.issubset({1, 2, 3}))\nprint({1, 2, 3}.issuperset({1, 4}))\nprint({1, 2}.isdisjoint({3, 4}))","uitvoer":"True\nFalse\nTrue\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[]}],"o":5},{"l":3,"fr":[{"f":"","l":3,"v":[]}],"o":11},{"l":null,"fr":[{"f":"","l":null,"v":[]}],"o":16,"end":true}]}],"oefeningen":[{"t":"voorspel","code":"print(len({1, 2, 2, 3, 3, 3}))\nprint(sorted(set(\"banaan\")))","uitleg":"Dubbels tellen niet mee: {1, 2, 3}. In banaan zitten de letters a, b en n.","id":"sets-1","uitvoer":"3\n['a', 'b', 'n']\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[]}],"o":2},{"l":null,"fr":[{"f":"","l":null,"v":[]}],"o":18,"end":true}]},{"t":"voorspel","code":"a = {1, 2, 3}\nb = {2, 3, 4}\nprint(sorted(a | b))\nprint(sorted(a & b))\nprint(sorted(a - b))","uitleg":"Vereniging: alles. Doorsnede: wat in beide zit. Verschil: wat alleen in a zit.","id":"sets-2","uitvoer":"[1, 2, 3, 4]\n[2, 3]\n[1]\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[["a","{1, 2, 3}"]]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[["a","{1, 2, 3}"],["b","{2, 3, 4}"]]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[["a","{1, 2, 3}"],["b","{2, 3, 4}"]]}],"o":13},{"l":5,"fr":[{"f":"","l":5,"v":[["a","{1, 2, 3}"],["b","{2, 3, 4}"]]}],"o":20},{"l":null,"fr":[{"f":"","l":null,"v":[["a","{1, 2, 3}"],["b","{2, 3, 4}"]]}],"o":24,"end":true}]},{"t":"voorspel","code":"s = {1, 2}\ns.add(2)\ns.add(5)\nprint(len(s))","uitleg":"2 zat er al in, dus enkel 5 komt erbij: 3 elementen.","id":"sets-3","uitvoer":"3\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[["s","{1, 2}"]]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[["s","{1, 2}"]]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[["s","{1, 2, 5}"]]}],"o":0},{"l":null,"fr":[{"f":"","l":null,"v":[["s","{1, 2, 5}"]]}],"o":2,"end":true}]},{"t":"keuze","vraag":"Hoe maak je een **lege set**?","opties":["{}","set()","[]","()"],"juist":1,"uitleg":"`{}` is een lege **dictionary**. Voor een lege set gebruik je `set()`.","id":"sets-4"},{"t":"keuze","vraag":"Wat gebeurt er?","opties":["Er gebeurt niets","Een fout: KeyError","Het toont {1, 2}","7 wordt toegevoegd"],"juist":1,"uitleg":"`remove` geeft een KeyError als het element er niet in zit. `discard(7)` zou geen fout geven.","code":"s = {1, 2}\ns.remove(7)\nprint(s)","id":"sets-5","uitvoer":"","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[["s","{1, 2}"]]}],"o":0},{"l":null,"fr":[{"f":"","l":null,"v":[["s","{1, 2}"]]}],"o":0,"end":true}],"fout":["KeyError","7",2]},{"t":"voorspel","code":"print({1, 2}.issubset({1, 2, 3}))\nprint({1, 2}.isdisjoint({2, 5}))","uitleg":"{1, 2} zit helemaal in {1, 2, 3}. {1, 2} en {2, 5} hebben 2 gemeen, dus niet disjunct.","id":"sets-6","uitvoer":"True\nFalse\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[]}],"o":5},{"l":null,"fr":[{"f":"","l":null,"v":[]}],"o":11,"end":true}]},{"t":"schrijf","vraag":"Schrijf een functie `gemeenschappelijk(w1, w2)` die een **set** teruggeeft met alle\nletters die in beide woorden voorkomen. `gemeenschappelijk(\"een\", \"peer\")` geeft `{\"e\"}`.","oplossing":"def gemeenschappelijk(w1, w2):\n    return set(w1) & set(w2)","uitleg":"Zet beide woorden om naar een set en neem de doorsnede. Dubbels verdwijnen vanzelf.","tests":[["gemeenschappelijk('een', 'peer')","{'e'}"],["gemeenschappelijk('abc', 'xyz')","set()"],["gemeenschappelijk('banaan', 'ananas')","{'n', 'a'}"]],"start":"def gemeenschappelijk(w1, w2):","boek":"Opgave in 14.2.9","id":"sets-7"},{"t":"schrijf","vraag":"Schrijf een functie `aantal_verschillend(lst)` die teruggeeft hoeveel **verschillende**\nwaarden er in een list zitten. `aantal_verschillend([1, 2, 2, 3, 1])` geeft 3.","oplossing":"def aantal_verschillend(lst):\n    return len(set(lst))","uitleg":"Een set bevat elk element maar één keer.","tests":[["aantal_verschillend([1, 2, 2, 3, 1])","3"],["aantal_verschillend([])","0"],["aantal_verschillend(['a', 'a'])","1"]],"start":"def aantal_verschillend(lst):","id":"sets-8"},{"t":"schrijf","vraag":"Maak drie sets met de getallen van 1 tot en met 1000 die deelbaar zijn door\nrespectievelijk 3, 7 en 11. Toon daarna, gesorteerd, de getallen die in **alle drie**\nde sets zitten (als list, met `sorted`).","oplossing":"drie = set()\nzeven = set()\nelf = set()\nfor i in range(1, 1001):\n    if i % 3 == 0:\n        drie.add(i)\n    if i % 7 == 0:\n        zeven.add(i)\n    if i % 11 == 0:\n        elf.add(i)\nprint(sorted(drie & zeven & elf))","uitleg":"Met list comprehensions kan het korter: `drie = set([i for i in range(1, 1001) if i % 3 == 0])`.\nDe doorsnede van de drie sets zijn de veelvouden van 3 · 7 · 11 = 231.","ptests":[[[],"[231, 462, 693, 924]"]],"boek":"Opgave 14.2","id":"sets-9"}],"nr":12},{"key":"bestanden","titel":"Tekstbestanden","kort":"open, read, readline, write","hoofdstuk":"15 en 16","spiek":["files"],"doel":"Je kan een tekstbestand openen, lezen (alles, per regel), schrijven en sluiten.","uitleg":[{"titel":"Een bestand openen, lezen en sluiten","tekst":"Werken met een tekstbestand gebeurt altijd in drie stappen (cursus 16.2):\n1. **openen**: `fp = open(\"pc_rose.txt\")` geeft een *handle* (hier `fp`)\n2. **lezen** of **schrijven** via die handle\n3. **sluiten**: `fp.close()`\n\n`fp.read()` leest het **hele** bestand in één string.\nBestaat het bestand niet, dan krijg je een **FileNotFoundError**.\n\nIn deze app bestaan de bestanden alleen in het geheugen. Bij elke\noefening zie je wat erin staat.","code":"fp = open(\"pc_rose.txt\")\ninhoud = fp.read()\nfp.close()\nprint(inhoud)","bestanden":{"pc_rose.txt":"Het is slechts je naam die mijn vijand is;\nJij bent wie je bent, jezelf, niet een Montague.\nWat is een Montague? Is het een hand, een voet,\neen arm, een gezicht, of enig ander deel\nbehorend aan een man? O, had je maar een andere naam!\nWat betekent een naam? Dat wat wij een roos noemen\n"},"uitvoer":"Het is slechts je naam die mijn vijand is;\nJij bent wie je bent, jezelf, niet een Montague.\nWat is een Montague? Is het een hand, een voet,\neen arm, een gezicht, of enig ander deel\nbehorend aan een man? O, had je maar een andere naam!\nWat betekent een naam? Dat wat wij een roos noemen\n\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[["inhoud","'Het is slechts je naam die mijn vijand is;\\nJij bent wie je bent, jezelf, ni..."]]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[["inhoud","'Het is slechts je naam die mijn vijand is;\\nJij bent wie je bent, jezelf, ni..."]]}],"o":0},{"l":null,"fr":[{"f":"","l":null,"v":[["inhoud","'Het is slechts je naam die mijn vijand is;\\nJij bent wie je bent, jezelf, ni..."]]}],"o":287,"end":true}]},{"titel":"Regel per regel lezen","tekst":"Drie manieren om per regel te lezen (cursus 16.2.5 en 16.2.6):\n- `fp.readline()` leest **één** regel; aan het einde van het bestand\n  geeft het een lege string `\"\"`\n- `fp.readlines()` geeft een **list** met alle regels\n- `for regel in fp:` loopt over de regels\n\n**Let op:** elke regel eindigt met een `\\n`. Print je de regel, dan\nkomt er nog een nieuwe eten `:`, een haakje te weinig)\n- een **runtime error** of **exception**: de code is correct geschreven,\n  maar tijdens het uitvoeren loopt er iets mis\n\nDe bekendste exceptions:\n- `ValueError`: verkeerde waarde, zoals `int(\"abc\")`\n- `ZeroDivisionError`: delen door nul\n- `IndexError`: een index die niet bestaat\n- `KeyError`: een key die niet in een dictionary zit\n- `TypeError`: verkeerd type, zoals `\"a\" + 1`\n- `NameError`: een variabele die niet bestaat\n- `FileNotFoundError`: een bestand dat niet bestaat"},{"titel":"try ... except","tekst":"Code die een exception kan geven, zet je in een `try`-blok. Gebeurt er een\nexception, dan springt Python meteen naar het `except`-blok (cursus 17.2.1).\nDe rest van het `try`-blok wordt dan **overgeslagen**.\n\nNoem altijd de exception die je verwacht (cursus 17.2.2), zodat je geen\nandere fouten verstopt. Je mag meerdere `except`-blokken na elkaar zetten.","code":"for tekst in [\"12\", \"abc\", \"0\"]:\n    try:\n        getal = int(tekst)\n        print(100 / getal)\n    except ValueError:\n        print(tekst, \"is geen getal\")\n    except ZeroDivisionError:\n        print(\"delen door nul\")","uitvoer":"8.333333333333334\nabc is geen getal\ndelen door nul\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[["tekst","'12'"]]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[["tekst","'12'"]]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[["tekst","'12'"],["getal","12"]]}],"o":0},{"l":1,"fr":[{"f":"","l":1,"v":[["tekst","'12'"],["getal","12"]]}],"o":18},{"l":2,"fr":[{"f":"","l":2,"v":[["tekst","'abc'"],["getal","12"]]}],"o":18},{"l":3,"fr":[{"f":"","l":3,"v":[["tekst","'abc'"],["getal","12"]]}],"o":18},{"l":5,"fr":[{"f":"","l":5,"v":[["tekst","'abc'"],["getal","12"]]}],"o":18},{"l":6,"fr":[{"f":"","l":6,"v":[["tekst","'abc'"],["getal","12"]]}],"o":18},{"l":1,"fr":[{"f":"","l":1,"v":[["tekst","'abc'"],["getal","12"]]}],"o":36},{"l":2,"fr":[{"f":"","l":2,"v":[["tekst","'0'"],["getal","12"]]}],"o":36},{"l":3,"fr":[{"f":"","l":3,"v":[["tekst","'0'"],["getal","12"]]}],"o":36},{"l":4,"fr":[{"f":"","l":4,"v":[["tekst","'0'"],["getal","0"]]}],"o":36},{"l":5,"fr":[{"f":"","l":5,"v":[["tekst","'0'"],["getal","0"]]}],"o":36},{"l":7,"fr":[{"f":"","l":7,"v":[["tekst","'0'"],["getal","0"]]}],"o":36},{"l":8,"fr":[{"f":"","l":8,"v":[["tekst","'0'"],["getal","0"]]}],"o":36},{"l":1,"fr":[{"f":"","l":1,"v":[["tekst","'0'"],["getal","0"]]}],"o":51},{"l":null,"fr":[{"f":"","l":null,"v":[["tekst","'0'"],["getal","0"]]}],"o":51,"end":true}]},{"titel":"else en finally","tekst":"(cursus 17.2.3 en 17.2.4)\n- `else:` wordt uitgevoerd als er **geen** exception was\n- `finally:` wordt **altijd** uitgevoerd, met of zonder exception.\n  Handig om een bestand zeker te sluiten.","code":"try:\n    x = 10 / 2\nexcept ZeroDivisionError:\n    print(\"delen door nul\")\nelse:\n    print(\"resultaat\", x)\nfinally:\n    print(\"klaar\")","uitvoer":"resultaat 5.0\nklaar\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[]}],"o":0},{"l":6,"fr":[{"f":"","l":6,"v":[["x","5.0"]]}],"o":0},{"l":8,"fr":[{"f":"","l":8,"v":[["x","5.0"]]}],"o":14},{"l":null,"fr":[{"f":"","l":null,"v":[["x","5.0"]]}],"o":20,"end":true}]},{"titel":"Informatie over de exception","tekst":"Met `except ValueError as ex:` krijg je de exception in de variabele `ex`\n(cursus 17.2.5). Print je `ex`, dan zie je de foutmelding.","code":"try:\n    getal = int(\"3,5\")\nexcept ValueError as ex:\n    print(\"Fout:\", ex)","uitvoer":"Fout: invalid literal for int() with base 10: '3,5'\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[["ex","ValueError(\"invalid literal for int() with base 10: '3,5'\")"]]}],"o":0},{"l":null,"fr":[{"f":"","l":null,"v":[]}],"o":52,"end":true}]},{"titel":"Zelf een exception genereren: raise","tekst":"Met `raise` genereer je zelf een exception (cursus 17.4), bijvoorbeeld als een\nfunctie een ongeldige waarde krijgt: `raise ValueError(\"uitleg\")`.\nWie de functie aanroept, kan die exception dan opvangen.\n\nDe functies van **pcinput** (zoals `getInteger()`) werken zo: een\n`while True` met `try`/`except ValueError` die blijft vragen tot het lukt.","code":"def wortel(x):\n    if x < 0:\n        raise ValueError(\"geen wortel uit een negatief getal\")\n    return x ** 0.5\n\ntry:\n    print(wortel(16))\n    print(wortel(-4))\nexcept ValueError as ex:\n    print(\"Fout:\", ex)","uitvoer":"4.0\nFout: geen wortel uit een negatief getal\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":6,"fr":[{"f":"","l":6,"v":[]}],"o":0},{"l":7,"fr":[{"f":"","l":7,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":7,"v":[]},{"f":"wortel","l":2,"v":[["x","16"]]}],"o":0},{"l":4,"fr":[{"f":"","l":7,"v":[]},{"f":"wortel","l":4,"v":[["x","16"]]}],"o":0},{"l":4,"fr":[{"f":"","l":7,"v":[]},{"f":"wortel","l":4,"v":[["x","16"]]}],"o":0,"ret":["wortel","4.0"]},{"l":8,"fr":[{"f":"","l":8,"v":[]}],"o":4},{"l":2,"fr":[{"f":"","l":8,"v":[]},{"f":"wortel","l":2,"v":[["x","-4"]]}],"o":4},{"l":3,"fr":[{"f":"","l":8,"v":[]},{"f":"wortel","l":3,"v":[["x","-4"]]}],"o":4},{"l":3,"fr":[{"f":"","l":8,"v":[]},{"f":"wortel","l":3,"v":[["x","-4"]]}],"o":4,"ret":["wortel","None"]},{"l":9,"fr":[{"f":"","l":9,"v":[]}],"o":4},{"l":10,"fr":[{"f":"","l":10,"v":[["ex","ValueError('geen wortel uit een negatief getal')"]]}],"o":4},{"l":null,"fr":[{"f":"","l":null,"v":[]}],"o":45,"end":true}]}],"oefeningen":[{"t":"voorspel","code":"try:\n    x = int(\"abc\")\n    print(\"gelukt\")\nexcept ValueError:\n    print(\"geen getal\")\nprint(\"einde\")","uitleg":"`int(\"abc\")` geeft een ValueError. De rest van het try-blok (`gelukt`) wordt overgeslagen.","id":"exceptions-1","uitvoer":"geen getal\neinde\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[]}],"o":0},{"l":5,"fr":[{"f":"","l":5,"v":[]}],"o":0},{"l":6,"fr":[{"f":"","l":6,"v":[]}],"o":11},{"l":null,"fr":[{"f":"","l":null,"v":[]}],"o":17,"end":true}]},{"t":"voorspel","code":"try:\n    print(10 / 2)\nexcept ZeroDivisionError:\n    print(\"delen door nul\")\nelse:\n    print(\"geen fout\")\nfinally:\n    print(\"klaar\")","uitleg":"Geen exception: dus het else-blok, en finally komt altijd.","id":"exceptions-2","uitvoer":"5.0\ngeen fout\nklaar\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[]}],"o":0},{"l":6,"fr":[{"f":"","l":6,"v":[]}],"o":4},{"l":8,"fr":[{"f":"","l":8,"v":[]}],"o":14},{"l":null,"fr":[{"f":"","l":null,"v":[]}],"o":20,"end":true}]},{"t":"voorspel","code":"try:\n    print(10 / 0)\nexcept ZeroDivisionError:\n    print(\"delen door nul\")\nelse:\n    print(\"geen fout\")\nfinally:\n    print(\"klaar\")","uitleg":"Nu wel een exception: het except-blok, géén else, en finally komt altijd.","id":"exceptions-3","uitvoer":"delen door nul\nklaar\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[]}],"o":0},{"l":8,"fr":[{"f":"","l":8,"v":[]}],"o":15},{"l":null,"fr":[{"f":"","l":null,"v":[]}],"o":21,"end":true}]},{"t":"voorspel","code":"lst = [1, 2, 3]\nfor i in [1, 5, 2]:\n    try:\n        print(lst[i])\n    except IndexError:\n        print(\"index\", i, \"bestaat niet\")","uitleg":"Index 5 bestaat niet. De exception wordt opgevangen en de loop gaat gewoon verder.","id":"exceptions-4","uitvoer":"2\nindex 5 bestaat niet\n3\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[["lst","[1, 2, 3]"]]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[["lst","[1, 2, 3]"],["i","1"]]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[["lst","[1, 2, 3]"],["i","1"]]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[["lst","[1, 2, 3]"],["i","1"]]}],"o":2},{"l":3,"fr":[{"f":"","l":3,"v":[["lst","[1, 2, 3]"],["i","5"]]}],"o":2}, ":2,"fr":[{"f":"","l":8,"v":[]},{"f":"wortel","l":2,"v":[["x","-4"]]}],"o":4},{"l":3,"fr":[{"f":"","l":8,"v":[]},{"f":"wortel","l":3,"v":[["x","-4"]]}],"o":4},{"l":3,"fr":[{"f":"","l":8,"v":[]},{"f":"wortel","l":3,"v":[["x","-4"]]}],"o":4,"ret":["wortel","None"]},{"l":10,"fr":[{"f":"","l":10,"v":[]}],"o":4},{"l":11,"fr":[{"f":"","l":11,"v":[["ex","ValueError('negatief getal')"]]}],"o":4},{"l":null,"fr":[{"f":"","l":null,"v":[]}],"o":25,"end":true}]},{"t":"voorspel","code":"while True:\n    try:\n        n = int(input(\"Getal: \"))\n        break\n    except ValueError:\n        print(\"probeer opnieuw\")\nprint(n * 2)","uitleg":"Zo werkt `getInteger()` uit pcinput: `abc` en `2.5` geven een ValueError, pas bij 7 komt de `break`.","inputs":["abc","2.5","7"],"vraag":"De gebruiker typt **abc**, dan **2.5**, dan **7**. Wat toont `print`? (Schrijf de vraag van input niet mee op.)","id":"exceptions-8","uitvoer":"probeer opnieuw\nprobeer opnieuw\n14\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[]}],"o":0},{"l":5,"fr":[{"f":"","l":5,"v":[]}],"o":0},{"l":6,"fr":[{"f":"","l":6,"v":[]}],"o":0},{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":16},{"l":2,"fr":[{"f":"","l":2,"v":[]}],"o":16},{"l":3,"fr":[{"f":"","l":3,"v":[]}],"o":16},{"l":5,"fr":[{"f":"","l":5,"v":[]}],"o":16},{"l":6,"fr":[{"f":"","l":6,"v":[]}],"o":16},{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":32},{"l":2,"fr":[{"f":"","l":2,"v":[]}],"o":32},{"l":3,"fr":[{"f":"","l":3,"v":[]}],"o":32},{"l":4,"fr":[{"f":"","l":4,"v":[["n","7"]]}],"o":32},{"l":7,"fr":[{"f":"","l":7,"v":[["n","7"]]}],"o":32},{"l":null,"fr":[{"f":"","l":null,"v":[["n","7"]]}],"o":35,"end":true}]},{"t":"aanvullen","vraag":"Vul aan zodat een ongeldige invoer niet tot een crash leidt.","code":"tekst = \"twaalf\"\n___:\n    getal = int(tekst)\n___ ValueError:\n    getal = 0\nprint(getal)","antwoorden":[["try"],["except"]],"uitleg":"`try` rond de gevaarlijke regel, `except ValueError` voor wat er dan moet gebeuren.","id":"exceptions-9","ingevuld":"tekst = \"twaalf\"\ntry:\n    getal = int(tekst)\nexcept ValueError:\n    getal = 0\nprint(getal)","uitvoer":"0\n","stappen":[{"l":1,"fr":[{"f":"","l":1,"v":[]}],"o":0},{"l":2,"fr":[{"f":"","l":2,"v":[["tekst","'twaalf'"]]}],"o":0},{"l":3,"fr":[{"f":"","l":3,"v":[["tekst","'twaalf'"]]}],"o":0},{"l":4,"fr":[{"f":"","l":4,"v":[["tekst","'twaalf'"]]}],"o":0},{"l":5,"fr":[{"f":"","l":5,"v":[["tekst","'twaalf'"]]}],"o":0},{"l":6,"fr":[{"f":"","l":6,"v":[["tekst","'twaalf'"],["getal","0"]]}],"o":0},{"l":null,"fr":[{"f":"","l":null,"v":[["tekst","'twaalf'"],["getal","0"]]}],"o":2,"end":true}]},{"t":"schrijf","vraag":"Schrijf een functie `veilig_delen(a, b)` die `a / b` teruggeeft, of `None` als b\ngelijk is aan 0. Gebruik `try` en `except` (geen if).","oplossing":"def veilig_delen(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None","uitleg":"Vang precies de ZeroDivisionError op, geen andere fouten.","tests":[["veilig_delen(10, 4)","2.5"],["veilig_delen(1, 0)","None"],["veilig_delen(0, 5)","0.0"]],"start":"def veilig_delen(a, b):","verboden":["if "],"id":"exceptions-10"},{"t":"schrijf","vraag":"Vraag een geheel getal. Typt de gebruiker iets wat geen geheel getal is, toon dan\n`Geen geheel getal -- probeer het opnieuw` en vraag opnieuw. Toon daarna het\ndubbel van het getal. (Dit is wat `getInteger()` van pcinput doet.)","oplossing":"while True:\n    try:\n        getal = int(input(\"Getal: \"))\n        break\n    except ValueError:\n        print(\"Geen geheel getal -- probeer het opnieuw\")\nprint(getal * 2)","uitleg":"Een loop-en-een-half met `try`/`except` in de loop.","ptests":[[["abc","3.5","4"],"Geen geheel getal -- probeer het opnieuw\nGeen geheel getal -- probeer het opnieuw\n8"],[["10"],"20"]],"boek":"Bijlage C (pcinput)","id":"exceptions-11"},{"t":"schrijf","vraag":"Schrijf een functie `lees_getal(naam)` die het bestand met die naam opent en het\ngehele getal op de eerste regel teruggeeft. Bestaat het bestand niet, of staat er\ngeen geheel getal, geef dan `-1` terug.\n(`a.txt` bevat `42`, `b.txt` bevat `hallo`, `c.txt` bestaat niet.)","oplossing":"def lees_getal(naam):\n    try:\n        fp = open(naam)\n        regel = fp.readline()\n        fp.close()\n        return int(regel)\n    except FileNotFoundError:\n        return -1\n    except ValueError:\n        return -1","uitleg":"Twee mogelijke exceptions: FileNotFoundError en ValueError. Je mag ze ook samen opvangen: `except (FileNotFoundError, ValueError):`.","tests":[["lees_getal('a.txt')","42"],["lees_getal('b.txt')","-1"],["lees_getal('c.txt')","-1"]],"start":"def lees_getal(naam):","uitdaging":true,"boek":"Hoofdstuk 17.3","bestanden":{"a.txt":"42\n","b.txt":"hallo\n"},"id":"exceptions-12"},{"t":"schrijf","vraag":"Schrijf een functie `controleer_leeftijd(x)` die x teruggeeft als 0 ≤ x ≤ 130,\nen anders zelf een `ValueError` genereert met `raise`.\n(In de tests geeft `geeft_fout(f, x)` aan welke exception `f(x)` geeft.)","oplossing":"def controleer_leeftijd(x):\n    if x < 0 or x > 130:\n        raise ValueError(\"ongeldige leeftijd\")\n    return x","uitleg":"`raise ValueError(\"uitleg\")` stopt de functie meteen, net als een return, maar met een fout.","tests":[["controleer_leeftijd(20)","20"],["geeft_fout(controleer_leeftijd, -1)","'ValueError'"],["geeft_fout(controleer_leeftijd, 200)","'ValueError'"],["controleer_leeftijd(0)","0"]],"start":"def controleer_leeftijd(x):","id":"exceptions-13"}],"nr":14}],"later":[{"key":"binair","titel":"Binaire bestanden en bits","kort":"bytes, pointers, bitsgewijze operatoren","hoofdstuk":"18 en 19","spiek":[],"inhoud":"Binaire bestanden openen met mode `\"rb\"` en `\"wb\"`, `seek()` en `tell()`, en rekenen met bits: `&`, `|`, `^`, `<<`, `>>`.","nr":15},{"key":"objecten","titel":"Objecten en klassen","kort":"class, methodes, overerving","hoofdstuk":"20 tot 22","spiek":[],"inhoud":"Een eigen `class` maken met `__init__` en met eeksen* (met een index), onderaan de *sleutel-containers*.","kennen":["`list`: `[1, 5, 9]`, kan je aanpassen; `[]` is leeg (H12)","`tuple`: `(1, 5, 9)`, kan je **niet** aanpassen (H11)","`(\"mot\",)`: een tuple met één element heeft een komma nodig (H11)","`str` is ook een reeks: van tekens (H10)","`dict`: `{\"key\": \"waarde\"}` (H13)","`set` en `frozenset` (H14)"],"overslaan":["de opmerking over *hashable values*","`bytes`: pas in H18"],"code":"lst = [1, 5, 9]\ntup = (1, 5, 9)\nd = {\"één\": 1, \"twee\": 2}\nprint(lst[0], tup[1], d[\"twee\"])","uitvoer":"1 5 2\n"},{"id":"identifiers","naam":"Identifiers","nl":"Namen","kant":"voorkant","belang":2,"niveau":"start","uitleg":"De regels voor namen van variabelen en functies.","kennen":["letters, cijfers en `_`; niet beginnen met een cijfer","geen Python-woorden (`if`, `for`, `and`, ...)","hoofdletters tellen: `Naam` ≠ `naam`","goed: `a`, `toto`, `x7`, `y_max`, `BigOne`; fout: `8y`, `and`, `for`"],"overslaan":["accenten (*diacritics*) mogen, maar vermijd ze"]},{"id":"assignment","naam":"Variables assignment","nl":"Toekennen met =","kant":"voorkant","belang":3,"niveau":"start","uitleg":"`=` koppelt een naam aan een waarde. Python rekent **eerst de rechterkant\nuit** en steekt het resultaat daarna in de naam links.","kennen":["`x = 1.2 + 8`: rechts eerst uitrekenen (H4.1)","`a = b = c = 0`: drie variabelen tegelijk op 0","`y, z, r = 9.2, -7.6, 0`: meerdere tegelijk (H11.1)","`a, b = b, a`: twee waarden wisselen (H4, opgave 4.4)","`x += 3` is `x = x + 3`; zo ook `-=`, `*=`, `/=` (H4.5)","`x = None`: een lege waarde, \"nog niets\" (H8.2.5)","`del`: een element uit een list of dictionary verwijderen (H12.4, H13.1)"],"overslaan":["`a, *b = seq` (uitpakken met sterretje)"],"code":"a = b = 0\ny, z = 9.2, -7.6\na, b = 3, 8\na, b = b, a\na += 3\nprint(a, b, y, z)","uitvoer":"11 3 9.2 -7.6\n"},{"id":"conversions","naam":"Conversions","nl":"Omzetten","kant":"voorkant","belang":3,"niveau":"functies-basis","uitleg":"Een waarde omzetten naar een ander type. Nodig na `input`, want dat geeft\naltijd tekst.","kennen":["`int(\"15\")` → `15` (H5.2.1)","`int(15.56)` → `15`: kapt af, rondt **niet** af!","`float(\"2.5\")` → `2.5`, `str(15)` → `\"15\"`","`round(15.56, 1)` → `15.6` (H5.2.2)","`type(x)` toont het type","`chr(64)` → `'@'` en `ord('@')` → `64` (H10.7)","`list(\"abc\")` → `['a', 'b', 'c']` (H12.7)","`set(...)` maakt een set (H14)","`\":\".join([...])` en `\"...\".split()` (H10.6)","`[int(x) for x in ...]`: list comprehension (H12.8)"],"overslaan":["`int(\"3f\", 16)` (andere talstelsels)","`bool(x)` en `repr(x)`","`bytes`: pas in H18"],"code":"print(int(\"15\") + 1)\nprint(int(15.56), round(15.56, 1))\nprint(float(\"2.5\") * 2, str(15) + \"!\")\nprint(list(\"abc\"))","uitvoer":"16\n15 15.6\n5.0 15!\n['a', 'b', 'c']\n"},{"id":"indexing","naam":"Sequence Containers Indexing","nl":"Index en slices","kant":"voorkant","belang":3,"niveau":"strings","uitleg":"Hoe je één element of een stuk uit een list (of tekst) haalt. De tekening\nmet `lst = [10, 20, 30, 40, 50]` is het belangrijkste deel van deze kant.","kennen":["de index begint bij **0**: `lst[0]` → 10 (H10.4, H12.1)","negatief telt van achteren: `lst[-1]` → 50 (laatste)","`len(lst)` → 5; de laatste index is `len(lst) - 1`","`lst[1:3]` → `[20, 30]`: het einde zit er **niet** in","`lst[:3]`, `lst[3:]`, en met stap: `lst[::2]`, `lst[::-1]` (H10.4.3)","`lst[4] = 25` verandert een element (H12.2)","`lst[1:4] = [15, 25]` en `del lst[3:5]` (H12.2, H12.4)","`lst[:]` maakt een (ondiepe) kopie (H12.5)"],"overslaan":[],"code":"lst = [10, 20, 30, 40, 50]\nprint(lst[0], lst[-1], len(lst))\nprint(lst[1:3], lst[:3], lst[3:])\nprint(lst[::-1])","uitvoer":"10 50 5\n[20, 30] [10, 20, 30] [40, 50]\n[50, 40, 30, 20, 10]\n"},{"id":"boolean-logic","naam":"Boolean Logic","nl":"Waar of onwaar","kant":"voorkant","belang":3,"niveau":"condities","uitleg":"Vergelijkingen geven `True` of `False`. Met `and`, `or` en `not`\ncombineer je ze.","kennen":["`<`, `>`, `<=`, `>=`, `==` (gelijk), `!=` (niet gelijk)","`a and b`: allebei waar","`a or b`: minstens één waar","`not a`: omgekeerd","`=` is toekennen, `==` is vergelijken"],"overslaan":["de *pitfall* over wat `and`/`or` teruggeven als a en b geen booleans zijn"],"code":"a, b = 4, 9\nprint(a < b, a == b, a != b)\nprint(a > 3 and b > 10, a > 3 or b > 10, not a > 3)","uitvoer":"True False True\nFalse True False\n"},{"id":"blocks","naam":"Statements Blocks","nl":"Blokken en inspringen","kant":"voorkant","belang":3,"niveau":"condities","uitleg":"Na een regel met `:` (if, for, while, def) komt een **blok** dat\ningesprongen staat. Alles wat even ver ingesprongen staat, hoort bij dat blok.","kennen":["dubbele punt `:` op het einde van de regel","4 spaties inspringen","het blok stopt waar het inspringen stopt","blokken kunnen in elkaar zitten (een if in een for)"],"overslaan":[]},{"id":"imports","naam":"Modules/Names Imports","nl":"Importeren","kant":"voorkant","belang":2,"niveau":"rekenen","uitleg":"Extra functies (zoals `sqrt`) zitten in **modules**. Die moet je eerst\nimporteren.","kennen":["`from math import sqrt, pi`: daarna gewoon `sqrt(16)` (H5.3)","`import math`: daarna `math.sqrt(16)` (H5.3)","`from math import sqrt as wortel`: hernoemen met `as` (H5.3)","een eigen module is gewoon een bestand `truc.py` (H8.5)"],"overslaan":["`sys.path`"],"code":"from math import sqrt, pi\nimport math\nprint(sqrt(16), math.sqrt(16), round(pi, 3))","uitvoer":"4.0 4.0 3.142\n"},{"id":"conditional","naam":"Conditional Statement","nl":"Als ... dan (if)","kant":"voorkant","belang":3,"niveau":"condities","uitleg":"Een blok wordt alleen uitgevoerd als de conditie waar is. Met `elif` en\n`else` kies je tussen meerdere gevallen: **alleen het eerste ware blok**\nwordt uitgevoerd.","kennen":["`if conditie:` + ingesprongen blok","zoveel `elif` als je wil, maximaal één `else` op het einde","het voorbeeld met `age` en `state`"],"overslaan":["`if x:` als kortere versie van `if bool(x) == True:`"],"code":"age = 30\nif age <= 18:\n    state = \"Kid\"\nelif age > 65:\n    state = \"Retired\"\nelse:\n    state = \"Active\"\nprint(state)","uitvoer":"Active\n"},{"id":"maths","naam":"Maths","nl":"Rekenen","kant":"voorkant","belang":3,"niveau":"rekenen","uitleg":"De rekenbewerkingen en de module `math`. Kommagetallen zijn **benaderingen**:\n`0.1 + 0.2` is niet exact `0.3`.\n\nKlein detail: op het blad staat `pow(4,3)→64.0`. In Python 3 geeft\n`pow(4, 3)` gewoon `64`; alleen `math.pow(4, 3)` geeft `64.0`.","kennen":["`+ - * /` en `**` (macht) (H3.3)","`//` integer deling, `%` modulo (rest) (H3.3)","voorrang: haakjes, dan `**`, dan `* / // %`, dan `+ -`","`abs(-3.2)` → 3.2, `round(3.57, 1)` → 3.6, `pow`, `max`, `min` (H5.2.2)","uit `math`: `sqrt`, `exp`, `log`, `floor`, `ceil`, `pi` (H5.3.1)","uit `random`: `random()`, `randint(a, b)`, `seed()` (H5.3.2)"],"overslaan":["`@` (matrices)","`sin`, `cos` (wel in `math`, maar het boek gebruikt ze niet)","de modules `decimal` en `numpy`","`statistics`: pas in H27"],"code":"from math import sqrt, floor, ceil\nprint(17 // 5, 17 % 5, 2 ** 10)\nprint(abs(-3.2), round(3.57, 1), sqrt(81))\nprint(floor(12.5), ceil(12.5), pow(4, 3))\nprint(0.1 + 0.2)","uitvoer":"3 2 1024\n3.2 3.6 9.0\n12 13 64\n0.30000000000000004\n"},{"id":"exceptions","naam":"Exceptions on Errors","nl":"Fouten opvangen","kant":"voorkant","belang":2,"niveau":"exceptions","uitleg":"Een fout (*exception*) stopt normaal je programma. Met `try` / `except`\nvang je ze op. Dat staat in hoofdstuk 17 van je cursus.","kennen":["hoe een foutmelding eruitziet: `NameError`, `TypeError`, `IndexError`, ... (H17.1)","`try:` ... `except ValueError:` (H17.2)","`except ValueError as ex:` (H17.2.5)","`else` en `finally` (H17.2.3 en 17.2.4)","`raise ValueError(\"...\")` (H17.4)"],"overslaan":[],"code":"try:\n    x = int(\"abc\")\nexcept ValueError:\n    print(\"Dat is geen getal\")","uitvoer":"Dat is geen getal\n"},{"id":"while","naam":"Conditional Loop Statement","nl":"Herhalen met while","kant":"achterkant","belang":3,"niveau":"while","uitleg":"Het blok wordt herhaald **zolang** de conditie waar is. Het voorbeeld\nberekent de som van i² voor i van 1 tot 100.","kennen":["beginwaarde vóór de loop (`s = 0`, `i = 1`)","conditie (`while i <= 100:`)","de variabele verandert in de loop (`i = i + 1`)","*beware of infinite loops*: verandert er niets, dan stopt de loop nooit"],"overslaan":[],"code":"s = 0\ni = 1\nwhile i <= 100:\n    s = s + i ** 2\n    i = i + 1\nprint(\"sum:\", s)","uitvoer":"sum: 338350\n"},{"id":"for","naam":"Iterative Loop Statement","nl":"Herhalen met for","kant":"achterkant","belang":3,"niveau":"for","uitleg":"Het blok wordt uitgevoerd **voor elk element** van een reeks. Er staan twee\nmanieren: over de **waarden** lopen en over de **indexen** lopen.","kennen":["`for c in s:`: over de waarden (H7.2)","`for idx in range(len(lst)):`: over de indexen, als je `lst[idx]` wil aanpassen (H12.2)","`for key in d.keys():` over een dictionary (H13.2)","*good habit*: verander de loop-variabele niet zelf"],"overslaan":["`enumerate`"],"code":"lst = [11, 18, 9, 12, 23, 4, 17]\nlost = []\nfor idx in range(len(lst)):\n    val = lst[idx]\n    if val > 15:\n        lost.append(val)\n        lst[idx] = 15\nprint(\"modif:\", lst, \"-lost:\", lost)","uitvoer":"modif: [11, 15, 9, 12, 15, 4, 15] -lost: [18, 23, 17]\n"},{"id":"loop-control","naam":"Loop Control","nl":"break en continue","kant":"achterkant","belang":2,"niveau":"for","uitleg":"Een loop vroeger stoppen of een ronde overslaan.","kennen":["`break`: stop de loop meteen (H7.3.2)","`continue`: sla de rest van deze ronde over (H7.3.3)","`else` na een loop: alleen als er geen `break` was (H7.3.1)"],"overslaan":[],"code":"for i in range(10):\n    if i == 2:\n        continue\n    if i == 5:\n        break\n    print(i, end=\" \")","uitvoer":"0 1 3 4 "},{"id":"display","naam":"Display","nl":"print","kant":"achterkant","belang":3,"niveau":"start","uitleg":"`print` toont waarden, variabelen en uitkomsten van berekeningen.","kennen":["komma's: er komt automatisch een spatie tussen","`sep=\"-\"`: iets anders dan een spatie ertussen","`end=\"\"`: niet naar een nieuwe regel springen"],"overslaan":["`file=sys.stdout`"],"code":"x, y = 3, 5\nprint(\"v=\", 3, \"cm :\", x, \",\", y + 4)\nprint(1, 2, 3, sep=\"-\")\nprint(\"op\", end=\" \")\nprint(\"één regel\")","uitvoer":"v= 3 cm : 3 , 9\n1-2-3\nop één regel\n"},{"id":"input","naam":"Input","nl":"input","kant":"achterkant","belang":3,"niveau":"functies-basis","uitleg":"`input` vraagt iets aan de gebruiker. Het geeft **altijd tekst** terug.","kennen":["`s = input(\"Vraag: \")` geeft een `str`","voor een getal: `int(input(...))` of `float(input(...))`"],"overslaan":[]},{"id":"generic-ops","naam":"Generic Operations on Containers","nl":"Functies voor lists en co","kant":"achterkant","belang":3,"niveau":"lists","uitleg":"Functies die werken op lists, tuples, tekst, ... Een paar zie je heel vaak.","kennen":["`len(c)`, `min(c)`, `max(c)`, `sum(c)`","`sorted(c)`: een **nieuwe** gesorteerde list (H12.4)","`x in c` en `x not in c` (H6.1.3)","`c + c2` aan elkaar plakken, `c * 5` herhalen (H12.3)","`c.index(x)` positie, `c.count(x)` aantal keer (H12.4)","`copy.copy(c)` en `copy.deepcopy(c)`: ondiepe en diepe kopie (H12.5.2)"],"overslaan":["`enumerate` en `all`, `any`","`zip` en `reversed`: pas in H23"],"code":"c = [4, 8, 15, 16, 8]\nprint(len(c), min(c), max(c), sum(c))\nprint(sorted(c), 8 in c, 7 not in c)\nprint(c.index(15), c.count(8), [1, 2] + [3], [0] * 3)","uitvoer":"5 4 16 51\n[4, 8, 8, 15, 16] True True\n2 2 [1, 2, 3] [0, 0, 0]\n"},{"id":"range","naam":"Integer Sequences","nl":"range","kant":"achterkant","belang":3,"niveau":"for","uitleg":"`range(start, einde, stap)` maakt een reeks gehele getallen. **Het einde\nzit er nooit in.**","kennen":["`range(5)` → 0 1 2 3 4","`range(3, 8)` → 3 4 5 6 7","`range(2, 12, 3)` → 2 5 8 11","`range(20, 5, -5)` → 20 15 10","`range(len(seq))` → alle indexen van seq"],"overslaan":[],"code":"print(*range(5))\nprint(*range(3, 8))\nprint(*range(2, 12, 3))\nprint(*range(20, 5, -5))","uitvoer":"0 1 2 3 4\n3 4 5 6 7\n2 5 8 11\n20 15 10\n"},{"id":"list-ops","naam":"Operations on Lists","nl":"Lists aanpassen","kant":"achterkant","belang":3,"niveau":"lists","uitleg":"Methodes die de list **zelf** veranderen.","kennen":["`lst.append(x)`: achteraan toevoegen (H12.4)","`lst.extend(lst2)`: een hele list achteraan toevoegen","`lst.insert(i, x)`: invoegen op index i","`lst.remove(x)`: eerste x verwijderen","`lst.pop()`: laatste verwijderen en teruggeven","`lst.sort()` en `lst.reverse()`: de list zelf sorteren of omdraaien"],"overslaan":[],"code":"lst = [3, 1, 2]\nlst.append(5)\nlst.insert(0, 9)\nlst.remove(1)\nx = lst.pop()\nlst.sort()\nprint(lst, x)","uitvoer":"[2, 3, 9] 5\n"},{"id":"def","naam":"Function Definition","nl":"Een functie maken","kant":"achterkant","belang":3,"niveau":"functies","uitleg":"Met `def` maak je een functie: een **zwarte doos** met invoer\n(parameters) en uitvoer (`return`).","kennen":["`def naam(x, y):` met dubbele punt (H8.2)","`return res` geeft het resultaat terug (H8.2.5)","zonder return geeft de functie `None` terug","variabelen in de functie bestaan alleen in die functie: scope (H8.3)","standaardwaarden zoals `def f(x, a=3):` (H8.2.4)","documentatie tussen `\"\"\"` bovenaan de functie (H8.2.11)"],"overslaan":["*Advanced*: `*args`, `**kwargs`"],"code":"def fct(x, y, z):\n    \"\"\"telt drie getallen op\"\"\"\n    res = x + y + z\n    return res\n\nprint(fct(1, 2, 3))","uitvoer":"6\n"},{"id":"call","naam":"Function Call","nl":"Een functie aanroepen","kant":"achterkant","belang":3,"niveau":"functies","uitleg":"Een functie doet pas iets als je ze **aanroept**: naam plus haakjes.","kennen":["`r = fct(3, i + 2, 2 * i)`: het resultaat in r steken","één argument per parameter, in dezelfde volgorde","zonder haakjes wordt de functie niet uitgevoerd"],"overslaan":["*Advanced*: `*sequence`, `**dict`"],"code":"def fct(a, b, c):\n    return a * 100 + b * 10 + c\n\ni = 2\nr = fct(3, i + 2, 2 * i)\nprint(r)","uitvoer":"344\n"},{"id":"dict-ops","naam":"Operations on Dictionaries","nl":"Woordenboeken","kant":"achterkant","belang":2,"niveau":"dictionaries","uitleg":"Een dict koppelt **sleutels** aan **waarden**, zoals een woordenboek.\nIn je cursus is dat hoofdstuk 13.","kennen":["`d[key] = waarde`: toevoegen of aanpassen (H13.1)","`d[key]`: opzoeken, en `del d[key]`: verwijderen (H13.1)","`d.get(key, standaard)`: opzoeken zonder fout (H13.2.3)","`d.keys()`, `d.values()`, `d.items()` (H13.2.2)","`d.copy()` (H13.2.1)"],"overslaan":["`update`, `pop`, `popitem`, `setdefault`, `clear`"],"code":"punten = {\"Zeb\": 14, \"Lies\": 16}\npunten[\"Tom\"] = 12\nprint(punten[\"Zeb\"], punten.get(\"An\", 0))\nfor naam, p in punten.items():\n    print(naam, p)","uitvoer":"14 0\nZeb 14\nLies 16\nTom 12\n"},{"id":"set-ops","naam":"Operations on Sets","nl":"Verzamelingen","kant":"achterkant","belang":2,"niveau":"sets","uitleg":"Een set is een verzameling zonder dubbels en zonder volgorde. Met de\nbewerkingen van de wiskunde: unie `|`, doorsnede `&`, verschil `-`.","kennen":["een set heeft geen dubbels en geen vaste volgorde (H14.1)","`s.add(x)`, `s.update(...)`, `s.remove(x)`, `s.discard(x)`, `s.clear()` (H14.2)","`a.union(b)` of `a | b`: vereniging","`a.intersection(b)` of `a & b`: doorsnede","`a.difference(b)` of `a - b`: verschil","`issubset`, `issuperset`, `isdisjoint` (H14.2.8)","`frozenset`: een set die je niet kan veranderen (H14.3)"],"overslaan":["de operatoren `^`, `<` en `<=` (je cursus gebruikt de methodes)"],"code":"a = {1, 2, 3}\nb = {2, 3, 4}\nprint(a | b, a & b, a - b)","uitvoer":"{1, 2, 3, 4} {2, 3} {1}\n"},{"id":"string-ops","naam":"Operations on Strings","nl":"Tekst bewerken","kant":"achterkant","belang":2,"niveau":"strings","uitleg":"Methodes voor tekst. Ze geven altijd een **nieuwe** tekst terug; de\noorspronkelijke tekst verandert niet (cursus hoofdstuk 10).","kennen":["`s.strip()`: spaties vooraan en achteraan weg (H10.6)","`s.upper()`, `s.lower()`","`s.find(x)`: index van x, of -1","`s.replace(oud, nieuw)`","`s.split(\",\")`: opsplitsen in een list","`\",\".join(lst)`: list samenvoegen tot tekst"],"overslaan":["`count`, `startswith`, `endswith` (handig, maar niet in je cursus)","`isalpha()` en de andere `is...()` (handig, maar niet in je cursus)","`partition`, `casefold`, `center`, `ljust`, `rjust`, `zfill`, `swapcase`","`encode`: pas in H18"],"code":"s = \"  Python op papier  \"\nprint(s.strip().upper())\nprint(\"1,4,8,2\".split(\",\"))\nprint(\"-\".join([\"a\", \"b\", \"c\"]))\nprint(\"programmeren\".count(\"r\"))","uitvoer":"PYTHON OP PAPIER\n['1', '4', '8', '2']\na-b-c\n3\n"},{"id":"files","naam":"Files","nl":"Bestanden","kant":"achterkant","belang":2,"niveau":"bestanden","uitleg":"Tekst opslaan in een bestand en terug inlezen (cursus hoofdstuk 16).","kennen":["`fp = open(\"pc_rose.txt\")` en op het einde `fp.close()` (H16.2)","`fp.read()` (alles), `fp.readline()` (één regel), `fp.readlines()` (list van regels)","`with open(\"file.txt\") as fp:` sluit het bestand vanzelf (onderaan rechts)","modes: `\"r\"` lezen, `\"w\"` schrijven, `\"a\"` toevoegen (H16.3, 16.4)","`fp.write(...)` en `fp.writelines(...)` (H16.3)","`os.path.exists()`, `os.path.getsize()`, `os.path.join()` (H16.5)"],"overslaan":["`seek`, `tell`, binaire modus `b`: pas in H18","`flush`, `truncate`"]},{"id":"formatting","naam":"Formatting","nl":"Opmaak","kant":"achterkant","belang":2,"niveau":"functies-basis","uitleg":"Getallen netjes in tekst zetten, bijvoorbeeld met 2 cijfers na de komma.","kennen":["`\"{} en {}\".format(a, b)`: waarden invullen (H5.2.6)","`\"{:.2f}\".format(x)`: 2 cijfers na de komma","`{:5}`, `{:<5}`, `{:^5}`, `{:>5}`: breedte en uitlijning (H5.2.6)","`{:d}` voor gehele getallen, `{:f}` voor kommagetallen"],"overslaan":["`!r` en `!s`, en het teken `+` (zoals in `{:+2.3f}`)"],"code":"x = 45.72793\nprint(\"{:.2f}\".format(x))\nprint(\"{} en {}\".format(\"Zeb\", 18))","uitvoer":"45.73\nZeb en 18\n"}],"instapt const RUNNER_PY = "# Tekstbestanden in het geheugen, zodat oefeningen met open() overal werken:\n# in build.py (gewone Python) en in de browser (Brython).\n# Dezelfde code wordt op beide plaatsen gebruikt.\n\n\nclass NepBestand:\n    def __init__(self, fs, naam, mode):\n        self.fs = fs\n        self.naam = naam\n        self.mode = mode\n        self.gesloten = False\n        self.pos = 0\n        if \"r\" in mode and \"+\" not in mode:\n            if naam not in fs:\n                raise FileNotFoundError(\"[Errno 2] No such file or directory: '\" + str(naam) + \"'\")\n            self.leesbaar = True\n            self.schrijfbaar = False\n        elif \"w\" in mode:\n            fs[naam] = \"\"\n            self.leesbaar = False\n            self.schrijfbaar = True\n        elif \"a\" in mode:\n            if naam not in fs:\n                fs[naam] = \"\"\n            self.leesbaar = False\n            self.schrijfbaar = True\n        else:\n            raise ValueError(\"invalid mode: '\" + str(mode) + \"'\")\n\n    def _controleer(self, lezen):\n        if self.gesloten:\n            raise ValueError(\"I/O operation on closed file.\")\n        if lezen and not self.leesbaar:\n            raise OSError(\"not readable\")\n        if not lezen and not self.schrijfbaar:\n            raise OSError(\"not writable\")\n\n    def read(self, n=-1):\n        self._controleer(True)\n        data = self.fs[self.naam]\n        if n is None or n < 0:\n            stuk = data[self.pos:]\n        else:\n            stuk = data[self.pos:self.pos + n]\n        self.pos += len(stuk)\n        return stuk\n\n    def readline(self):\n        self._controleer(True)\n        data = self.fs[self.naam]\n        i = data.find(\"\\n\", self.pos)\n        einde = len(data) if i < 0 else i + 1\n        stuk = data[self.pos:einde]\n        self.pos = einde\n        return stuk\n\n    def readlines(self):\n        regels = []\n        while True:\n            r = self.readline()\n            if r == \"\":\n                return regels\n            regels.append(r)\n\n    def __iter__(self):\n        return iter(self.readlines())\n\n    def write(self, s):\n        self._controleer(False)\n        if not isinstance(s, str):\n            raise TypeError(\"write() argument must be str, not \" + type(s).__name__)\n        self.fs[self.naam] = self.fs[self.naam] + s\n        return len(s)\n\n    def writelines(self, regels):\n        for r in regels:\n            self.write(r)\n\n    def close(self):\n        self.gesloten = True\n\n    def __enter__(self):\n        return self\n\n    def __exit__(self, *args):\n        self.close()\n        return False\n\n\ndef maak_open(fs):\n    def nep_open(naam, mode=\"r\", encoding=None, **andere):\n        return NepBestand(fs, naam, mode)\n\n    return nep_open\n\n\ndef geeft_fout(f, *args):\n    \"\"\"Hulpje voor tests: welke exception geeft f(*args)? None als er geen is.\"\"\"\n    try:\n        f(*args)\n    except Exception as e:\n        return type(e).__name__\n    return None\n\n\n# Draait in de browser (Brython, in een Web Worker).\n# Voert code van de leerling uit en test ze. Geeft altijd JSON-tekst terug.\n# build.py zet nepbestanden.py (maak_open, geeft_fout) vóór deze code.\nimport sys\nimport json\nimport traceback\nfrom browser import self as W\n\n\nclass Uit:\n    def __init__(self):\n        self.buf = []\n\n    def write(self, s):\n        self.buf.append(str(s))\n\n    def flush(self):\n        pass\n\n\ndef _foutinfo(e):\n    ln = getattr(e, \"lineno\", None)\n    try:\n        for fr in traceback.extract_tb(e.__traceback__):\n            if fr.filename == \"<zeb>\":\n                ln = fr.lineno\n    except Exception:\n        pass\n    msg = str(e)\n    if isinstance(e, SyntaxError):\n        msg = getattr(e, \"msg\", None) or msg\n    return [type(e).__name__, msg, ln]\n\n\ndef _voer_uit(src, inputs, echo, bestanden):\n    uit = Uit()\n    voeding = list(inputs)\n\n    def nep_input(prompt=\"\"):\n        if echo:\n            uit.write(str(prompt))\n        if not voeding:\n            raise EOFError(\"Er is geen invoer meer om te lezen.\")\n        v = voeding.pop(0)\n        if echo:\n            uit.write(v + \"\\n\")\n        return v\n\n    g = {\"__name__\": \"__main__\", \"input\": nep_input, \"open\": maak_open(dict(bestanden)),\n         \"geeft_fout\": geeft_fout}\n    oud = sys.stdout\n    sys.stdout = uit\n    fout = None\n    try:\n        exec(compile(src, \"<zeb>\", \"exec\"), g)\n    except BaseException as e:\n        fout = _foutinfo(e)\n    finally:\n        sys.stdout = oud\n    return g, \"\".join(uit.buf), fout\n\n\ndef _norm(s):\n    lijnen = [ln.rstrip() for ln in s.replace(\"\\r\", \"\").split(\"\\n\")]\n    while lijnen and lijnen[-1] == \"\":\n        lijnen.pop()\n    return \"\\n\".join(lijnen)\n\n\ndef zeb_run(src, inputs_json, bestanden_json):\n    _, uit, fout = _voer_uit(src, json.loads(inputs_json), True, json.loads(bestanden_json))\n    return json.dumps({\"uit\": uit, \"fout\": fout})\n\n\ndef zeb_test(src, tests_json, ptests_json, bestanden_json):\n    tests = json.loads(tests_json)\n    ptests = json.loads(ptests_json)\n    bestanden = json.loads(bestanden_json)\n    resultaten = []\n    algemene_fout = None\n    if tests:\n        g, uit, fout = _voer_uit(src, [], False, bestanden)\n        if fout:\n            algemene_fout = fout\n        else:\n            for expr, verwacht in tests:\n                r = {\"vraag\": expr, \"verwacht\": verwacht}\n                try:\n                    waarde = eval(expr, g)\n                    r[\"kreeg\"] = repr(waarde)\n                    r[\"ok\"] = waarde == eval(verwacht)\n                except BaseException as e:\n                    r[\"fout\"] = _foutinfo(e)\n                    r[\"ok\"] = False\n                resultaten.append(r)\n    for inputs, verwacht in ptests:\n        _, uit, fout = _voer_uit(src, inputs, False, bestanden)\n        r = {\"invoer\": inputs, \"verwacht\": verwacht, \"kreeg\": uit}\n        if fout:\n            r[\"fout\"] = fout\n        r[\"ok\"] = (fout is None) and _norm(uit) == _norm(verwacht)\n        resultaten.append(r)\n    return json.dumps({\"resultaten\": resultaten, \"fout\": algemene_fout})\n\n\nW.zebRun = zeb_run\nW.zebTest = zeb_test\n";
</script>

  const MIGRATIE = DATA.migratie || {};
  // Volgorde van de niveaus in de eerste versie van de app (voor oude voortgang).

  // =====================================================================
  // Kleine hulpjes
  // =====================================================================
  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function inline(s) {
    // `code` eerst apart houden, dan **vet** en *schuin* in de rest.
    return String(s)
      .split(/(`[^`]+`)/g)
      .map((deel) => {
        if (deel.startsWith("`") && deel.endsWith("`") && deel.length > 1) {
          return "<code>" + esc(deel.slice(1, -1)) + "</code>";
        }
        return esc(deel)
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,:;!?)]|$)/g, "$1<em>$2</em>");
      })
      .join("");
  }
  function md(tekst) {
    if (!tekst) return "";
    const blokken = String(tekst).split(/\n\s*\n/);
    return blokken
      .map((blok) => {
        const regels = blok.split("\n");
        let html = "";
        let list = null; // {tag, items}
        let para = [];
        const sluitPara = () => {
          if (para.length) html += "<p>" + inline(para.join(" ")) + "</p>";
          para = [];
        };
        const sluitLijst = () => {
          if (list) html += `<${list.tag}>` + list.items.map((i) => "<li>" + inline(i) + "</li>").join("") + `</${list.tag}>`;
          list = null;
        };
        for (const r of regels) {
          const ul = r.match(/^\s*-\s+(.*)$/);
          const ol = r.match(/^\s*\d+\.\s+(.*)$/);
          if (ul || ol) {
            sluitPara();
            const tag = ul ? "ul" : "ol";
            if (!list || list.tag !== tag) {
              sluitLijst();
              list = { tag, items: [] };
            }
            list.items.push((ul || ol)[1]);
          } else if (list && /^\s+\S/.test(r)) {
            list.items[list.items.length - 1] += " " + r.trim();
          } else {
            sluitLijst();
            if (r.trim()) para.push(r.trim());
          }
        }
        sluitPara();
        sluitLijst();
        return html;
      })
      .join("");
  }
  function maak(html) {
    const t = document.createElement("template");
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function vandaag(d) {
    const x = d || new Date();

  }
  function norm(s) {
    const r = String(s).replace(/\r/g, "").split("\n").map((l) => l.replace(/\s+$/, ""));

    return r.join("\n");
  }

  }

  // =====================================================================

  const KW = new Set("False None True and as assert break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
  const BI = new Set("print input len range int float str list dict set tuple sum min max abs round sorted type enumerate zip bool pow sqrt reversed any all open floor ceil".split(" "));
  const TOK = /(#.*$)|("(?:\\.|[^"\\])*"?|'(?:\\.|[^'\\])*'?)|(\b\d+(?:\.\d+)?(?:e[+-]?\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|(\s+)|([^])/g;
  function hl(regel) {
    let uit = "";
    regel.replace(TOK, (m, com, str, num, naam, ws) => {
      if (com) uit += `<span class="tk-com">${esc(com)}</span>`;
      else if (str) uit += `<span class="tk-str">${esc(str)}</span>`;
      else if (num) uit += `<span class="tk-num">${esc(num)}</span>`;
      else if (naam) {
        if (KW.has(naam)) uit += `<span class="tk-kw">${naam}</span>`;
        else if (BI.has(naam)) uit += `<span class="tk-bi">${naam}</span>`;
        else uit += esc(naam);
      } else uit += esc(m);
      return m;
    });
    return uit;
  }
  function codeHTML(code, opt) {
    opt = opt || {};
    const regels = code.split("\n");
    let vakNr = 0;
    const rijen = regels.map((r, i) => {
      const nr = i + 1;
      const cls = ["r"];
      if (opt.nu === nr) cls.push("nu");
      if (opt.vorige === nr && opt.nu !== nr) cls.push("vorige");
      if (opt.fout === nr) cls.push("fout-regel");
      if (opt.goed && opt.goed.includes(nr)) cls.push("goed-regel");

      if (opt.vakjes && r.includes("___")) {
        inhoud = r
          .split("___")
          .map((stuk, j) => (j === 0 ? "" : `<input class="vakje" data-v="${vakNr++}" aria-label="vakje ${vakNr}" autocomplete="off" autocapitalize="off" spellcheck="false">`) + hl(stuk))
          .join("");
      } else {
        inhoud = hl(r) || " ";
      }
      const rol = opt.klik ? ` role="button" tabindex="0" aria-label="regel ${nr}"` : "";
      return `<div class="${cls.join(" ")}" data-l="${nr}"${rol}><span class="ln">${nr}</span><span class="s">${inhoud}</span></div>`;
    });
    return `<div class="code${opt.klik ? " klikbaar" : ""}">${rijen.join("")}</div>`;
  }
  function bestandenHTML(b) {

  // =====================================================================

  const SLEUTEL = "pop-voortgang-v1";

  function leeg() {

  function migreer(s) {
    // Zet voortgang van de eerste versie (oefeningen "3-5", niveaus als getal) om.
    if (!s || typeof s !== "object") return s;
    const oud = (id) => /^\d+-\d+$/.test(id);
    if (s.ex && typeof s.ex === "object") {
      const nieuw = {};
      for (const id of Object.keys(s.ex)) {
        const doel = oud(id) ? MIGRATIE[id] : id;
        if (!doel) continue;
        if (!nieuw[doel] || (RANG[s.ex[id].b] || 0) > (RANG[nieuw[doel].b] || 0)) nieuw[doel] = s.ex[id];
      }
      s.ex = nieuw;
    }
    if (s.last && oud(s.last)) s.last = MIGRATIE[s.last] || null;
    if (s.test && typeof s.test.start === "number") {
      s.test.start = OUDE_VOLGORDE[s.test.start] || "start";
      if (s.test.per) {
        const p = {};
        for (const k of Object.keys(s.test.per)) p[OUDE_VOLGORDE[+k] || k] = s.test.per[k];
        s.test.per = p;
      }
    }
    if (s.test && !NIV_KEY[s.test.start]) s.test.start = NIV[0].key;
    return s;
  }
  function laad() {

  let S = laad();

  function bewaar() {

  function markeer(id, status) {
    const nu = Date.now();
    const r = S.ex[id];
    if (!r) S.ex[id] = { b: status, e: status, n: 1, t: nu };
    else {
      r.n = (r.n || 0) + 1;
      r.t = nu;
      if ((RANG[status] || 0) > (RANG[r.b] || 0)) r.b = status;

    S.days[d] = (S.days[d] || 0) + 1;

  function best(id) {
    return S.ex[id] ? S.ex[id].b : null;
  }
  function gelukt(id) {
    const b = best(id);
    return b === "goed" || b === "hulp";
  }
  function niveauStat(n) {
    const oefs = n.oefeningen;
    const ok = oefs.filter((o) => gelukt(o.id)).length;
    const meteen = oefs.filter((o) => S.ex[o.id] && S.ex[o.id].e === "goed").length;
    const gedaan = oefs.filter((o) => S.ex[o.id]).length;

  function dagenOpRij() {

  function aanbevolenNiveau() {
    const startNiv = S.test ? NIV_KEY[S.test.start] : null;

    for (const n of NIV) {
      if (n.nr < start) continue;
      if (!niveauStat(n).klaar) return n;

    for (const n of NIV) if (!niveauStat(n).klaar) return n;
    return NIV[NIV.length - 1];

  function volgendeOef(n) {

  // ---- gedeelde voortgang (alleen als de pagina in claude.ai draait) ----
  const SYNC = { ref: null, db: null, user: null, id: null, owner: false, bezig: false, opnieuw: false, timer: null };
  function voegSamen(ander) {
    if (!ander || typeof ander !== "object") return;
    ander = migreer(JSON.parse(JSON.stringify(ander)));
    const ex = ander.ex || {};
    for (const id of Object.keys(ex)) {
      const a = ex[id];
      const m = S.ex[id];
      if (!m) S.ex[id] = Object.assign({}, a);
      else {
        if ((RANG[a.b] || 0) > (RANG[m.b] || 0)) m.b = a.b;
        m.n = Math.max(m.n || 0, a.n || 0);
        if ((a.t || 0) < (m.t || 0) && a.e) m.e = a.e;
        m.t = Math.max(m.t || 0, a.t || 0);
      }
    }
    const days = ander.days || {};
    for (const d of Object.keys(days)) S.days[d] = Math.max(S.days[d] || 0, days[d] || 0);

  async function startSync() {

  // =====================================================================

  const PY = {

self.onmessage = function (e) {
  var m = e.data;
  if (m.type === "init") {
    try {
      importScripts(m.basis + "brython.min.js", m.basis + "brython_stdlib.js");
      brython({ debug: 1 });
      __BRYTHON__.runPythonSource(m.src, "zebrunner");
      postMessage({ type: "ready" });
    } catch (err) {
      postMessage({ type: "fail", msg: String(err) });
    }
    return;
  }
  if (m.type === "call") {
    try {
      var res = m.fn === "run"
        ? self.zebRun(m.src, JSON.stringify(m.inputs || []), JSON.stringify(m.bestanden || {}))
        : self.zebTest(m.src, JSON.stringify(m.tests || []), JSON.stringify(m.ptests || []), JSON.stringify(m.bestanden || {}));
      postMessage({ type: "res", id: m.id, res: JSON.parse(res) });
    } catch (err) {
      postMessage({ type: "res", id: m.id, err: String(err) });
    }
  }
};`;
  function zetPyStaat(s) {

  function startPython() {
    if (PY.staat === "klaar" || PY.staat === "laden") return PY.klaarBelofte;
    if (PY.staat === "kapot") return Promise.resolve(false);
    zetPyStaat("laden");
    PY.klaarBelofte = new Promise((resolve) => {
      let w;
      try {
        const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));
        w = new Worker(url);
      } catch (e) {
        zetPyStaat("kapot");
        resolve(false);
        return;
      }
      PY.worker = w;
      const opgeef = setTimeout(() => {
        w.terminate();
        PY.worker = null;
        zetPyStaat("kapot");
        resolve(false);
      }, 45000);
      w.onmessage = (e) => {
        const m = e.data;
        if (m.type === "ready") {
          clearTimeout(opgeef);
          zetPyStaat("klaar");
          resolve(true);
        } else if (m.type === "fail") {
          clearTimeout(opgeef);
          w.terminate();
          PY.worker = null;
          zetPyStaat("kapot");
          resolve(false);
        } else if (m.type === "res") {
          const p = PY.wacht[m.id];

            clearTimeout(p.timer);
            p.resolve(m.err ? { jsfout: m.err } : m.res);

  // =====================================================================

  function maakStapper(houder, code, stappen, uitvoer, opt) {
